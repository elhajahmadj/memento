            type: string
      responses:
        "200":
          description: The architecture
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Architecture"
        "404":
          description: Not found

  /architectures/delete:
    post:
      operationId: deleteArchitecture
      tags: [architecture]
      summary: Delete a custom architecture
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteArchitectureRequest"
      responses:
        "204":
          description: Deleted

  /audit:
    get:
      operationId: listAuditEvents
      tags: [audit]
      summary: List audit events (admin-only). Newest first, paginated.
      parameters:
        - in: query
          name: user
          required: false
          schema: { type: string }
          description: Filter by user id (UUID) or username.
        - in: query
          name: project
          required: false
          schema: { type: string }
          description: Filter by project (solution name).
        - in: query
          name: action
          required: false
          schema:
            type: string
            enum:
              - file_create
              - file_save
              - file_delete
              - file_rename
              - folder_create
              - recording_finalize
              - approval_submit
              - approval_approve
              - approval_reject
              - fork_create
              - fork_delete
              - role_change
              - project_assignment_create
              - project_assignment_remove
              - access_request_create
              - access_request_approve
              - access_request_deny
              - internal_test_run_start
              - internal_test_run_complete
              - recorded_action_edit
              - selector_heal
              - user_delete
              - project_git_pull
              - project_git_push
              - project_create_requested
              - project_create_approved
              - project_create_rejected
              - project_delete_requested
              - project_delete_approved
              - project_delete_rejected
              - project_delete_executed
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Page of audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventsPage"

  /admin/validation-traces:
    get:
      operationId: getValidationTraceStats
      tags: [admin]
      summary: |
        Disk usage and last-cleanup stats for the `.validation-traces` directory.
        Admin-only.
      responses:
        "200":
          description: Stats for the validation-traces directory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationTraceStats"

  /admin/internal-tests/suites:
    get:
      operationId: listInternalTestSuites
      tags: [admin]
      summary: |
        List internal vitest suites available to the admin Internal Tests panel,
        plus whether a run is currently in progress. Admin-only.
      responses:
        "200":
          description: Suite catalog and current run state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalTestSuitesResponse"

  /admin/internal-tests/runs:
    post:
      operationId: startInternalTestRun
      tags: [admin]
      summary: |
        Start a vitest run for one of the predefined suites. Returns 409 if
        another run is already in progress (only one at a time is allowed).
        Admin-only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartInternalTestRunRequest"
      responses:
        "201":
          description: Run started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalTestRunResponse"
        "409":
          description: Another run is already in progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalTestRunConflict"
        "503":
          description: Internal test runner is disabled (no source tree available).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                required: [error]

  /admin/internal-tests/runs/{id}:
    get:
      operationId: getInternalTestRun
      tags: [admin]
      summary: |
        Fetch the current state and full captured log of a single internal test
        run. Admin-only.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Run state plus captured log lines.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalTestRunWithLogResponse"
        "404":
          description: Run not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                required: [error]

  /admin/internal-tests/runs/{id}/stream:
    get:
      operationId: streamInternalTestRun
      tags: [admin]
      summary: |
        Server-Sent Events stream of a single internal test run. Emits a
        backlog of all captured log lines on connect, then `log` events
        for each new stdout/stderr line, and a final `done` event with the
        completed run object. Connection is held open with comment-line
        heartbeats every 15 seconds. Admin-only.

        The TypeScript client cannot be auto-generated for SSE responses;
        consume this endpoint with the browser `EventSource` API (or a
        compatible polyfill) using `withCredentials: true`. Documented
        here so the API contract remains complete.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: |
            Open SSE stream. Event types:
              - `log`  — `{ "line": string }`
              - `done` — `{ "run": InternalTestRun }`
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          description: Not authenticated.
        "403":
          description: Not a full admin.
        "404":
          description: Run not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                required: [error]

  /recording/status:
    get:
      operationId: getRecordingStatus
      tags: [recording]
      summary: Get current recording status
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingStatus"

  /recording/hook-state:
    get:
      operationId: getHookState
      tags: [recording]
      summary: Check whether a hook in a test class still holds the default stub
      parameters:
        - in: query
          name: filePath
          required: true
          schema: { type: string }
        - in: query
          name: hook
          required: true
          schema:
            type: string
            enum: [beforeEach, oneTimeSetup]
      responses:
        "200":
          description: Hook state
          content:
            application/json:
              schema:
                type: object
                properties:
                  isDefault: { type: boolean }
                  body:
                    type: string
                    description: Current hook body (with common indent stripped) when not the default stub.
                required: [isDefault]

  /recording/replayable-hooks:
    get:
      operationId: getReplayableHooks
      tags: [recording]
      summary: List which setup hooks of a test class will replay automatically before a new [Test] recording
      parameters:
        - in: query
          name: filePath
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Per-hook replay availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayableHooksResult"

  /recording/named-urls:
    get:
      operationId: getRecordingNamedUrls
      tags: [recording]
      summary: List the named start URLs the current project already has on disk
      description: >
        Reads the project's existing named URLs (C# → `appsettings.json` `Urls`,
        Node/Python → `<SOL>_URL_*` keys in `.env`). Returns `{ urls: [] }` for
        brand-new projects with no recorded URLs yet so the Start recording
        dialog can fall back to its free-text inputs.
      responses:
        "200":
          description: Named URLs the project has on disk
          content:
            application/json:
              schema:
                type: object
                properties:
                  urls:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        url: { type: string }
                      required: [name, url]
                required: [urls]
        "404":
          description: No current project loaded

  /recording/method-state:
    get:
      operationId: getMethodState
      tags: [recording]
      summary: Check whether a [Test] method with the given name already exists in a class
      parameters:
        - in: query
          name: filePath
          required: true
          schema: { type: string }
        - in: query
          name: methodName
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Method state
          content:
            application/json:
              schema:
                type: object
                properties:
                  exists: { type: boolean }
                  suggestedName: { type: string }
                required: [exists, suggestedName]

  /recording/start:
    post:
      operationId: startRecording
      tags: [recording]
      summary: Start a new recording session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRecordingRequest"
      responses:
        "200":
          description: Started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingStatus"

  /recording/open-browser:
    post:
      operationId: openRecordingBrowser
      tags: [recording]
      summary: Launch a Playwright Chromium session in open-browser mode
      description: |
        Opens a headless Chromium session navigated to `url` and streams
        frames over `/ws/recording`. Action events (clicks, fills,
        navigations) are NOT captured into the session buffer until a
        follow-up call to `/recording/attach-to-open-browser` flips the
        session into real recording mode. The URL the user lands on is
        deliberately NOT persisted to `appsettings.json` / `.env` — open
        browser mode never touches the project's named-URL store, so
        attach-then-finalize leaves the URL byte-identical to its
        pre-open-browser state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenBrowserRequest"
      responses:
        "200":
          description: Open-browser session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingStatus"

  /recording/attach-to-open-browser:
    post:
      operationId: attachToOpenBrowser
      tags: [recording]
      summary: Promote an open-browser session to a real recording
      description: |
        Promotes a session previously started by `/recording/open-browser`
        into a real recording. Action events start being captured into
        the session buffer from this point on. Suite mode is forced to
        `existing` (must target a real on-disk test class) and target is
        forced to `testMethod`. The request body deliberately rejects
        anything that would change the base URL or create a new suite.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachToOpenBrowserRequest"
      responses:
        "200":
          description: Attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingStatus"

  /recording/cancel-open-browser:
    post:
      operationId: cancelOpenBrowser
      tags: [recording]
      summary: Cancel an open-browser session without promoting it
      description: |
        Tears down the open-browser session started by
        `/recording/open-browser` without ever promoting it to a
        recording. Same teardown hooks as `/recording/discard`.
        Idempotent: returns `canceled: false` when no open-browser
        session was active.
      responses:
        "200":
          description: Canceled (or no-op)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelOpenBrowserResult"

  /recording/prewarm:
    post:
      operationId: prewarmRecordingBrowser
      tags: [recording]
      summary: Speculatively launch a headless browser to hide startup latency
      description: |
        Starts launching a headless Chromium browser in the background so
        it is ready by the time the caller reaches the workbench and
        begins recording. The frontend calls this the moment a user opens
        the New Project dialog or clicks Open on an existing project —
        before any project is necessarily loaded.

        Fire-and-forget: the launch happens off the request path and the
        response returns immediately. `POST /recording/start` and
        `POST /recording/open-browser` consume the pre-warmed browser when
        the user actually records; if they never do, an idle timer closes
        it. Safe to call repeatedly — a second call while one is already
        warming just keeps it alive. No request body and no project
        context required.
      responses:
        "200":
          description: Pre-warm started (or already in progress)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrewarmRecordingResult"

  /recording/edit-history:
    get:
      operationId: getRecordingEditHistory
      tags: [recording]
      summary: |
        Audit trail of `recorded_action_edit` rows for the caller's
        active recording session, newest-first. Admin / limited-admin
        only. Returns an empty `events` array (and `sessionToken: null`)
        when the caller has no active session.
      responses:
        "200":
          description: Per-session audit trail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingEditHistory"

  /recording/force-discard:
    post:
      operationId: forceDiscardRecording
      tags: [recording]
      summary: |
        Admin escape hatch — discard the global recording session
        regardless of who owns it.
      description: |
        The recorder backend stores a single in-memory session shared
        across all users, so a session left dangling by user A blocks
        every subsequent `POST /recording/start` from user B with
        "Recording already in progress" until the api-server restarts.
        This route lets any admin (or limited admin) clear the current
        session regardless of who owns it. Returns the displaced
        session's previous owner / project so the UI can confirm the
        action. Idempotent: returns `discarded: false` when no session
        was active.
      responses:
        "200":
          description: Discarded
          content:
            application/json:
              schema:
                type: object
                properties:
                  discarded: { type: boolean }
                  previousOwnerUserId: { type: ["string", "null"] }
                  previousProjectName: { type: ["string", "null"] }
                required: [discarded, previousOwnerUserId, previousProjectName]

  /recording/clear-hook-backups:
    post:
      operationId: clearHookBackups
      tags: [recording]
      summary: Delete every hook backup (.bak) file in the active project
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  deletedCount: { type: integer }
                  deletedPaths:
                    type: array
                    items: { type: string }
                required: [deletedCount, deletedPaths]

  /recording/stop:
    post:
      operationId: stopRecording
      tags: [recording]
      summary: Stop the recording browser without finalizing
      description: |
        Closes the headless browser and switches the session into the
        `stopped` phase. The captured action list stays available so the
        workbench can rename / delete actions and add UI assertions
        before the user calls `/recording/finalize` (Save for admins,
        Request SDET approval for limited users). Idempotent: calling
        again on a session that is already `stopped` is a no-op.
      responses:
        "200":
          description: Stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingStatus"

  /recording/finalize:
    post:
      operationId: finalizeRecording
      tags: [recording]
      summary: Finalize the recording (save or submit for approval)
      description: |
        Generates / merges the C# files for the current session and
        ends it. Admins use `mode: "save"` (default) which writes
        directly to the loaded project; limited users use
        `mode: "submit-for-approval"` which additionally snapshots
        the user's fork into a pending Approval submission. May be
        called whether the browser is still recording or already
        stopped — the server will close the browser if needed before
        finalizing.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StopRecordingRequest"
      responses:
        "200":
          description: Finalized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopRecordingResult"

  /api-tests/build:
    post:
      operationId: buildApiTest
      tags: [project]
      summary: Build a C# xUnit + HttpClient API test (atomic, no browser)
      description: |
        Atomically writes (or merges) the four artifacts that compose a
        single API test: the endpoint constant in
        `Constants/ApiEndpoints.cs`, the helper method on
        `APITestingAssistant`, the test class with `[Collection(TestCollections.Api)]`
        + FluentAssertions, and the `Tests/appsettings.json` URL entry.
        Only valid for projects whose `.testbuilder.json` marks them as
        `solutionType: "api"`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiTestBuildSpec"
      responses:
        "200":
          description: Files written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiTestBuildResult"

  /project-assignments:
