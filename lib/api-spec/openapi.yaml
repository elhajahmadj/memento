            - $ref: "#/components/schemas/InternalTestRun"
          nullable: true
      required: [enabled, suites, current]

    StartInternalTestRunRequest:
      type: object
      properties:
        suiteKey:
          $ref: "#/components/schemas/InternalTestSuiteKey"
      required: [suiteKey]

    InternalTestRunResponse:
      type: object
      properties:
        run:
          $ref: "#/components/schemas/InternalTestRun"
      required: [run]

    InternalTestRunConflict:
      type: object
      properties:
        error: { type: string }
        run:
          $ref: "#/components/schemas/InternalTestRun"
      required: [error, run]

    InternalTestRunWithLogResponse:
      type: object
      properties:
        run:
          $ref: "#/components/schemas/InternalTestRun"
        log:
          type: array
          items: { type: string }
      required: [run, log]

    # ---------------------------------------------------------------
    # Tier 3 — Route mocks (network mocking)
    # ---------------------------------------------------------------
    RouteMockMethod:
      type: string
      enum: [GET, POST, PUT, PATCH, DELETE]

    RouteMock:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        projectName: { type: string }
        name: { type: string }
        method:
          $ref: "#/components/schemas/RouteMockMethod"
        urlPattern: { type: string }
        status: { type: integer, minimum: 100, maximum: 599 }
        bodyJson:
          description: |
            Canned JSON response payload. `null` means the rule responds
            with an empty body (still using `application/json`).
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}
            - type: "null"
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required:
        - id
        - userId
        - projectName
        - name
        - method
        - urlPattern
        - status
        - bodyJson
        - enabled
        - createdAt
        - updatedAt

    CreateRouteMockRequest:
      type: object
      properties:
        projectName: { type: string, minLength: 1, maxLength: 200 }
        name: { type: string, minLength: 1, maxLength: 100 }
        method:
          $ref: "#/components/schemas/RouteMockMethod"
        urlPattern: { type: string, minLength: 1 }
        status: { type: integer, minimum: 100, maximum: 599 }
        bodyJson:
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}
            - type: "null"
        enabled: { type: boolean }
      required: [projectName, name, urlPattern]

    UpdateRouteMockRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        method:
          $ref: "#/components/schemas/RouteMockMethod"
        urlPattern: { type: string, minLength: 1 }
        status: { type: integer, minimum: 100, maximum: 599 }
        bodyJson:
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}
            - type: "null"
        enabled: { type: boolean }

    RouteMocksList:
      type: object
      properties:
        mocks:
          type: array
          items:
            $ref: "#/components/schemas/RouteMock"
      required: [mocks]

    # ---------------------------------------------------------------
    # Tier 3 — Demo project + onboarding tour state
    # ---------------------------------------------------------------
    DemoProjectResponse:
      type: object
      properties:
        slnPath: { type: string }
        solutionName: { type: string }
        seededTestMethods:
          type: array
          items: { type: string }
        seededMocks:
          type: array
          items: { type: string }
      required: [slnPath, solutionName, seededTestMethods, seededMocks]

    NavLayout:
      type: string
      enum: [top, side]
      description: |
        Where the primary navigation lives for the calling user.
        `top` is the default and renders the existing top bar; `side`
        swaps the shell to a left-hand side nav.

    UserPreferencesResponse:
      type: object
      properties:
        navLayout:
          $ref: "#/components/schemas/NavLayout"
      required: [navLayout]

    UpdateUserPreferencesRequest:
      type: object
      properties:
        navLayout:
          $ref: "#/components/schemas/NavLayout"
      required: [navLayout]

    TourStateResponse:
      type: object
      properties:
        hasSeenTour: { type: boolean }
      required: [hasSeenTour]

    SetTourSeenRequest:
      type: object
      properties:
        hasSeenTour: { type: boolean }
      required: [hasSeenTour]

    # ---------------------------------------------------------------
    # Test Explorer — discovery + selection-based runs
    # ---------------------------------------------------------------
    TestLanguage:
      type: string
      enum: [csharp, python, nodejs, java]
      description: |
        The four languages memento generates tests for. The server picks
        a parser per language and the corresponding CLI runner when
        executing a selection-based run.

    TestKind:
      type: string
      enum: [e2e, unit, api]
      description: |
        Test classification. A method is **e2e** by default if its file
        lives under an `e2e/` folder OR carries an e2e tag/attribute
        (`[Category("E2E")]`, `@pytest.mark.e2e`,
        `test.describe("@e2e", …)`, JUnit `@Tag("e2e")`); **api** if
        under `api/` or tagged `api`; **unit** otherwise. Folder
        convention is the default classifier; an explicit tag or
        attribute on the method (or its enclosing class) overrides
        folder placement.

    TestTotals:
      type: object
      description: Rolled-up counts of test methods inside this subtree.
      properties:
        e2e: { type: integer, minimum: 0 }
        unit: { type: integer, minimum: 0 }
        api: { type: integer, minimum: 0 }
        all: { type: integer, minimum: 0 }
      required: [e2e, unit, api, all]

    DiscoveredTestMethod:
      type: object
      description: |
        A single discovered test method (a leaf in the discovery tree).
      properties:
        type:
          type: string
          enum: [method]
        id:
          type: string
          description: |
            Stable, fully-qualified test ID — opaque to the UI, but the
            shape is contract-stable per language so the server can
            translate it back to the right CLI invocation:

              - **csharp** — `Namespace.ClassName.MethodName`
                (e.g. `Memento.Tests.Login.LoginSuite.HappyPath`).
                Parameterized `[TestCase]`s collapse into the parent
                method id; running it runs every case.
              - **python** — pytest node id:
                `relative/path/to/file.py::ClassName::test_method`
                (`ClassName::` omitted for module-level functions).
              - **nodejs** — Playwright human-readable id:
                `relative/path/to/file.spec.ts > describe title > test title`
                (` > ` separator). Nested describes chain with the same
                separator. Used as the `--grep` regex source after
                escaping.
              - **java** — `com.pkg.ClassName#methodName`.
        name:
          type: string
          description: The method's display name (last segment of `id`).
        kind:
          $ref: "#/components/schemas/TestKind"
        language:
          $ref: "#/components/schemas/TestLanguage"
      required: [type, id, name, kind, language]

    DiscoveredTestFile:
      type: object
      description: |
        A test file containing one or more discovered test methods.
      properties:
        type:
          type: string
          enum: [file]
        name: { type: string }
        path:
          type: string
          description: Project-relative POSIX path to the file.
        language:
          $ref: "#/components/schemas/TestLanguage"
        totals:
          $ref: "#/components/schemas/TestTotals"
        methods:
          type: array
          items:
            $ref: "#/components/schemas/DiscoveredTestMethod"
      required: [type, name, path, language, totals, methods]

    DiscoveredTestNode:
      description: |
        Either a folder (with rolled-up totals and child nodes) or a
        file (with the test methods inside it). Children of a folder
        are returned in deterministic order: folders first, then files,
        each block sorted alphabetically by `name`.
      oneOf:
        - $ref: "#/components/schemas/DiscoveredTestFolder"
        - $ref: "#/components/schemas/DiscoveredTestFile"
      discriminator:
        propertyName: type
        mapping:
          folder: "#/components/schemas/DiscoveredTestFolder"
          file: "#/components/schemas/DiscoveredTestFile"

    DiscoveredTestFolder:
      type: object
      description: |
        A folder in the discovery tree. Holds rolled-up test counts and
        nested folder/file children.
      properties:
        type:
          type: string
          enum: [folder]
        name: { type: string }
        path:
          type: string
          description: Project-relative POSIX path to the folder.
        totals:
          $ref: "#/components/schemas/TestTotals"
        children:
          type: array
          items:
            $ref: "#/components/schemas/DiscoveredTestNode"
      required: [type, name, path, totals, children]

    TestDiscoveryResponse:
      type: object
      description: |
        Top-level discovery payload for the currently loaded project.
        `root` is the project root folder and always carries the full
        rolled-up totals.
      properties:
        projectName: { type: string }
        slnPath: { type: string }
        root:
          $ref: "#/components/schemas/DiscoveredTestFolder"
      required: [projectName, slnPath, root]

    RunBySelectionRequest:
      type: object
      description: |
        Request body for a selection-based run. `testIds` must be a
        non-empty list of ids returned verbatim from a prior discovery
        response. The server groups them by language and dispatches
        each group to the right CLI runner.
      properties:
        testIds:
          type: array
          minItems: 1
          items:
            type: string
      required: [testIds]

    SelectionRunGroup:
      type: object
      description: |
        Per-language entry in a selection-based run. The body is a flat
        record carrying the standard `InternalTestRun` fields plus the
        `language`, the `testIds` that were dispatched, and the
        captured `stdout` / `stderr` from the CLI runner so the UI can
        show real compile errors and assertion traces inline.
      properties:
        id: { type: string }
        suiteKey: { type: string }
        suiteName: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [running, passed, failed, error]
        exitCode:
          type: integer
          nullable: true
        errorMessage:
          type: string
          nullable: true
        startedBy:
          $ref: "#/components/schemas/InternalTestRunStartedBy"
        language:
          $ref: "#/components/schemas/TestLanguage"
        testIds:
          type: array
          items: { type: string }
        stdout: { type: string }
        stderr: { type: string }
      required:
        - id
        - suiteKey
        - suiteName
        - startedAt
        - finishedAt
        - status
        - exitCode
        - errorMessage
        - startedBy
        - language
        - testIds
        - stdout
        - stderr

    SelectionRunDetail:
      type: object
      description: |
        Snapshot of a single dispatched selection run, returned by
        `GET /projects/{projectId}/runs/by-selection/{runId}`. Polled by
        the run-detail UI until `finishedAt` flips from null to a
        timestamp; `stdout` / `stderr` carry the captured CLI output
        (each capped at 256 KB) so SDETs can read compile errors and
        assertion traces without digging through server logs.
      properties:
        id: { type: string }
        suiteKey: { type: string }
        suiteName: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [running, passed, failed, error]
        exitCode:
          type: integer
          nullable: true
        errorMessage:
          type: string
          nullable: true
        startedBy:
          $ref: "#/components/schemas/InternalTestRunStartedBy"
        projectKey: { type: string }
        stdout: { type: string }
        stderr: { type: string }
      required:
        - id
        - suiteKey
        - suiteName
        - startedAt
        - finishedAt
        - status
        - exitCode
        - errorMessage
        - startedBy
        - projectKey
        - stdout
        - stderr

    RunBySelectionResponse:
      type: object
      description: |
        Response payload for a selection-based run — a list of
        per-language run entries, each carrying the standard
        `InternalTestRun` record so the UI reuses the existing
        run-detail surface.
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/SelectionRunGroup"
      required: [runs]

    AiAgentOrgConfig:
      type: object
      properties:
        organizationId: { type: string, nullable: true }
        enabled: { type: boolean }
        provider:
          type: string
