    InternalTestRun:
      type: object
      properties:
        id: { type: string }
        suiteKey:
          $ref: "#/components/schemas/InternalTestSuiteKey"
        suiteName: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [running, passed, failed, error]
        exitCode:
          type: integer
          nullable: true
        summary:
          allOf:
            - $ref: "#/components/schemas/InternalTestRunSummary"
          nullable: true
        errorMessage:
          type: string
          nullable: true
        startedBy:
          $ref: "#/components/schemas/InternalTestRunStartedBy"
      required:
        - id
        - suiteKey
        - suiteName
        - startedAt
        - finishedAt
        - status
        - exitCode
        - summary
        - errorMessage
        - startedBy

    InternalTestSuitesResponse:
      type: object
      properties:
        enabled: { type: boolean }
        suites:
          type: array
          items:
            $ref: "#/components/schemas/InternalTestSuiteDescriptor"
        current:
