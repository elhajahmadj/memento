      required: [projectName, enabled, updatedAt]
    AiAgentProjectConfigInput:
      type: object
      properties:
        enabled: { type: boolean }
        aiKeyId:
          type: string
          nullable: true
          description: |
            `null` to clear the per-project override and fall back to
            the org default. Omitted means "leave the current value
            untouched".
      required: [enabled]
    AiAgentKey:
      type: object
      properties:
        id: { type: string }
        organizationId: { type: string, nullable: true }
        name: { type: string }
        provider:
          type: string
          enum:
            [
              anthropic,
              openai,
              gemini,
              openrouter,
              azure_openai,
              groq,
              deepseek,
              mistral,
            ]
        apiKeyLastFour: { type: string }
        model: { type: string, nullable: true }
        endpointUrl: { type: string, nullable: true }
        apiVersion: { type: string, nullable: true }
        refererUrl: { type: string, nullable: true }
        appName: { type: string, nullable: true }
        isDefault: { type: boolean }
        createdAt: { type: string }
        updatedAt: { type: string }
      required:
        - id
        - organizationId
        - name
        - provider
        - apiKeyLastFour
        - model
        - endpointUrl
        - apiVersion
        - refererUrl
        - appName
        - isDefault
        - createdAt
        - updatedAt
    AiAgentKeyList:
      type: object
      properties:
        keys:
          type: array
          items: { $ref: "#/components/schemas/AiAgentKey" }
      required: [keys]
    AiAgentKeyInput:
      type: object
      properties:
        name: { type: string }
        provider:
          type: string
          enum:
            [
              anthropic,
              openai,
              gemini,
              openrouter,
              azure_openai,
              groq,
              deepseek,
              mistral,
            ]
        apiKey: { type: string }
        model: { type: string, nullable: true }
        endpointUrl: { type: string, nullable: true }
        apiVersion: { type: string, nullable: true }
        refererUrl: { type: string, nullable: true }
        appName: { type: string, nullable: true }
        isDefault: { type: boolean }
      required: [name, provider, apiKey]
    AiAgentKeyUpdateInput:
      type: object
      properties:
        name: { type: string }
        provider:
          type: string
          enum:
            [
              anthropic,
              openai,
              gemini,
              openrouter,
              azure_openai,
              groq,
              deepseek,
              mistral,
            ]
        apiKey:
          type: string
          nullable: true
          description: |
            When present, rotates the stored key. Omit or send `null`
            to keep the existing key unchanged.
        model: { type: string, nullable: true }
        endpointUrl: { type: string, nullable: true }
        apiVersion: { type: string, nullable: true }
        refererUrl: { type: string, nullable: true }
        appName: { type: string, nullable: true }
        isDefault: { type: boolean }
    AiAgentKeyDeleteConflict:
      type: object
      properties:
        error: { type: string }
        boundProjects:
          type: array
          items: { type: string }
      required: [error]
    AiAgentKeyCheckResult:
      type: object
      properties:
        ok: { type: boolean }
        provider:
          type: string
          enum:
            [
              anthropic,
              openai,
              gemini,
              openrouter,
              azure_openai,
              groq,
              deepseek,
              mistral,
            ]
        reason:
          type: string
          nullable: true
          enum: [unauthorized, rate_limited, not_found, network, other]
          description: |
            Structured failure code. `null` on success.
        message: { type: string, nullable: true }
        retryAfterSeconds: { type: integer, nullable: true }
      required: [ok, provider, reason, message, retryAfterSeconds]
    AiAgentStatus:
      type: object
      properties:
        ready: { type: boolean }
        orgEnabled: { type: boolean }
        projectEnabled: { type: boolean }
        keyConfigured: { type: boolean }
        provider:
          type: string
          enum:
            [
              anthropic,
              openai,
              gemini,
              openrouter,
              azure_openai,
              groq,
              deepseek,
              mistral,
            ]
          nullable: true
        reason: { type: string, nullable: true }
      required: [ready, orgEnabled, projectEnabled, keyConfigured, provider, reason]
    AiAgentCatalogMethod:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        signature: { type: string }
        description: { type: string, nullable: true }
        source: { type: string, enum: [user, ai] }
      required: [id, name, signature, description, source]
    AiAgentCatalogMethodInput:
      type: object
      properties:
        name: { type: string }
        signature: { type: string }
        description: { type: string, nullable: true }
      required: [name, signature]
    AiAgentCatalogSelector:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        selector: { type: string }
        source: { type: string, enum: [user, ai] }
      required: [id, name, selector, source]
    AiAgentCatalogSelectorInput:
      type: object
      properties:
        name: { type: string }
        selector: { type: string }
      required: [name, selector]
    AiAgentCatalogSelectorRename:
      type: object
      properties:
        name: { type: string }
      required: [name]
    AiAgentCatalogCategory:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        source: { type: string, enum: [user, ai] }
      required: [id, name, description, source]
    AiAgentCatalogCategoryInput:
      type: object
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
      required: [name]
    AiAgentCatalog:
      type: object
      properties:
        methods:
          type: array
          items: { $ref: "#/components/schemas/AiAgentCatalogMethod" }
        selectors:
          type: array
          items: { $ref: "#/components/schemas/AiAgentCatalogSelector" }
        categories:
          type: array
          items: { $ref: "#/components/schemas/AiAgentCatalogCategory" }
      required: [methods, selectors, categories]
    AiAgentRunRequest:
      type: object
      properties:
        kind: { type: string, enum: [playwright, api, unit] }
        plan: { type: string }
        suiteName: { type: string }
        methodName:
          type: string
          nullable: true
          description: |
            Optional caller-supplied test method name. When provided
            (and shaped like a valid identifier), the runner uses it
            verbatim instead of deriving `Given<X>_When<Y>_Then<Z>`
            from the plan. When omitted / blank, the AI / rule
            heuristics pick a name (existing behavior).
        category: { type: string, nullable: true }
        language: { type: string, enum: [csharp, python, nodejs, java] }
        targetMode:
          type: string
          enum: [new_suite, add_method]
          description: |
            Whether the AI run should generate a brand-new test suite
            file (`new_suite`) or append a new method beside an
            existing discovered suite (`add_method`). Defaults to
            `new_suite`.
        existingSuiteFile:
          type: string
          nullable: true
          description: |
            When `targetMode = add_method`, the project-relative POSIX
            path to the existing suite file the new method should sit
            next to. Ignored for `new_suite`.
        targetMethod:
          type: string
          enum: [test, beforeEach, oneTimeSetUp]
          description: |
            Which method the AI run should fill in. `test` (default)
            generates a new `[Test]` method, `beforeEach` fills the
            suite's `[SetUp] BeforeEachAsync` hook, and
            `oneTimeSetUp` fills the suite's `[OneTimeSetUp]
            OneTimeSetUpAsync` hook. Defaults to `test` server-side
            when omitted (back-compat for older clients).
        ignore:
          type: boolean
          description: |
            When true, the materialized test should be marked as
            ignored (e.g. `[Ignore("...")]` in NUnit) using
            `ignoreReason` as the message.
        ignoreReason:
          type: string
          nullable: true
          description: |
            Required when `ignore` is true. Free-text reason the test
            is being marked as ignored.
      required: [kind, plan, suiteName, language]
    AiAgentRunAccepted:
      type: object
      properties:
        id: { type: string }
        status: { type: string }
        startedAt: { type: string }
      required: [id, status, startedAt]
    AiAgentRunSummary:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [playwright, api, unit] }
        suiteName: { type: string }
        language: { type: string, enum: [csharp, python, nodejs, java] }
        status: { type: string, enum: [pending, running, succeeded, failed] }
        startedAt: { type: string }
        finishedAt: { type: string, nullable: true }
        completedAt: { type: string, nullable: true }
        errorMessage: { type: string, nullable: true }
        triggeredByUserId: { type: string }
      required: [id, kind, suiteName, status, startedAt]
    AiAgentRunList:
      type: object
      properties:
        runs:
          type: array
          items: { $ref: "#/components/schemas/AiAgentRunSummary" }
      required: [runs]
    AiAgentRunMaterializedFile:
      type: object
      properties:
        path: { type: string }
        bytes: { type: integer }
      required: [path, bytes]
    AiAgentRunDetail:
      allOf:
        - $ref: "#/components/schemas/AiAgentRunSummary"
        - type: object
          properties:
            plan: { type: string }
            errorMessage: { type: string, nullable: true }
            report:
              type: object
              nullable: true
              properties:
                steps:
                  type: array
                  items:
                    type: object
                    properties:
                      message: { type: string }
                      status:
                        type: string
                        enum: [passed, failed, skipped]
                        description: |
                          Per-step outcome. `passed` is a green check,
                          `failed` is a red X, and `skipped` is a
                          neutral indicator for steps the AI couldn't
                          auto-resolve to a known catalog method.
                    required: [message, status]
                files:
                  type: array
                  items: { $ref: "#/components/schemas/AiAgentRunMaterializedFile" }
                summary: { type: string }
                setupContextText:
                  type: ["string", "null"]
                  description: |
                    Combined plain-text setup context that the runner
                    prepended to the LLM prompt for `add_method` runs
                    against an existing test suite. Composed from
                    (a) the hidden `{ClassName}Setup` sidecar (the
                    user's original `beforeEach` plan) under a
                    `User setup plan:` header, followed by
                    (b) the existing suite's `[SetUp]` /
                    `[OneTimeSetUp]` hook bodies extracted from the
                    source file. `null` when the run had no prior
                    setup context (e.g. new-suite runs, beforeEach
                    runs, or runs whose existing suite has no setup
                    chain). Exposed so callers — and the
                    `test:e2e:ai-existing-suite` Playwright spec — can
                    verify the prepend contract end-to-end.
              required: [steps, files, summary]
          required: [plan, errorMessage, report]

    DashboardLink:
      type: object
      properties:
        label: { type: string }
        href: { type: string }
      required: [label, href]
    DashboardRecentRun:
      type: object
