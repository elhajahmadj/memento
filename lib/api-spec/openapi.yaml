          type: string
          description: Absolute path of the directory inspected.
        fileCount:
          type: integer
          description: Number of regular files currently on disk.
        totalBytes:
          type: integer
          description: Sum of file sizes in bytes.
        maxAgeMs:
          type: integer
          description: Cutoff age in milliseconds — files older than this are swept.
        lastCleanup:
          oneOf:
            - type: "null"
            - type: object
              properties:
                finishedAt: { type: string, format: date-time }
                filesDeleted: { type: integer }
                rowsCleared: { type: integer }
              required: [finishedAt, filesDeleted, rowsCleared]
      required: [dir, fileCount, totalBytes, maxAgeMs, lastCleanup]

    DeleteArchitectureRequest:
      type: object
      properties:
        id: { type: string }
      required: [id]

    StopRecordingResult:
      type: object
      description: |
        On success the response carries `status: "completed"` plus the list of
        generated files and a summary. When the requested test method name
        already exists in the target class, the server instead returns
        `status: "collision"` along with the colliding name, a suggested
        unique name, and the target class so the UI can prompt the user.
      properties:
        status:
          type: string
          enum: [completed, collision]
        generatedFiles:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/GeneratedFile"
        summary:
          type: ["string", "null"]
        methodName:
          type: ["string", "null"]
        suggestedName:
          type: ["string", "null"]
        targetClass:
          type: ["string", "null"]
        hookBackupPath:
          type: ["string", "null"]
          description: |
            Project-relative path to a `.bak` file that captured the
            previous setup-hook body when this recording overwrote a
            non-default hook. Null for test-method recordings, brand-new
            hooks, or hooks that only held the default stub.
        submissionId:
          type: ["string", "null"]
          description: |
            ID of the approval submission created by `submit-for-approval`
            mode. Null when the stop ran in plain `save` mode.
        submissionStatus:
          type: ["string", "null"]
          enum: [pending, approved, rejected, null]
          description: |
            Status of the approval submission, when one was created. Always
            `pending` immediately after submit. Null in `save` mode.
      required: [status]

