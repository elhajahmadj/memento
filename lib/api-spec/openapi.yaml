        children:
          type: array
          items:
            $ref: "#/components/schemas/TreeNode"
      required: [name, path, type]

    PipelinePlatform:
      type: string
      enum: [github, jenkins, gitlab, azure, circleci]
      description: |
        CI/CD platform the generated pipeline file targets. `jenkins`
        produces a Groovy `Jenkinsfile`; the rest produce YAML.

    PipelineMode:
      type: string
      enum: [ci, cd]
      description: |
        `ci` produces a single-job pipeline that builds and runs the
        Playwright tests on push / PR. `cd` produces a two-stage
        pipeline that publishes the project as a deployable artifact
        ("drop") and then pulls it down in a downstream stage to run
        the tests.

    GeneratePipelineFileRequest:
      type: object
      properties:
        platform:
          $ref: "#/components/schemas/PipelinePlatform"
        mode:
          $ref: "#/components/schemas/PipelineMode"
        overwrite:
          type: boolean
          description: |
            When true, allow replacing an existing pipeline file at the
            platform's standard path. When omitted/false, the server
            returns 409 if the file already exists so the UI can
            prompt the user to confirm.
      required: [platform, mode]

    GeneratePipelineFileResponse:
      type: object
      properties:
        path:
          type: string
          description: Project-relative path of the file that was written.
      required: [path]

    GeneratePipelineFileConflict:
      type: object
      properties:
        exists:
          type: boolean
          enum: [true]
        path:
          type: string
          description: Project-relative path of the existing pipeline file.
      required: [exists, path]

    FileContentResponse:
      type: object
      properties:
        path: { type: string }
        content: { type: string }
      required: [path, content]

    CreateFileRequest:
      type: object
      properties:
        path: { type: string }
        content:
          type: ["string", "null"]
      required: [path]

    UpdateFileRequest:
      type: object
