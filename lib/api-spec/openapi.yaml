        className: { type: string }
        path: { type: string }
      required: [className, path]

    ApiBaseUrlInfo:
      type: object
      properties:
        name: { type: string }
        baseUrl: { type: string }
      required: [name, baseUrl]

    GenerateTestClassRequest:
      type: object
      properties:
        className: { type: string }
      required: [className]

    GenerateTestMethodRequest:
      type: object
      properties:
        filePath: { type: string }
        methodName: { type: string }
      required: [filePath, methodName]

    StartRecordingRequest:
      type: object
      properties:
        startUrl: { type: string }
        urlName: { type: string }
        target:
          type: string
          enum: [testMethod, beforeEach, oneTimeSetup]
        methodName:
          type: ["string", "null"]
        existingTestClassPath:
          type: ["string", "null"]
        newTestClassName:
          type: ["string", "null"]
        overwriteExistingMethod:
          type: boolean
          description: When true, the user has already consented to overwrite an existing [Test] method with the same name in the target class.
        viewport:
          description: Optional override for the recording browser viewport size. Falls back to the server default (1280x800) when omitted.
          type: object
          properties:
            width:
              type: integer
              minimum: 320
              maximum: 3840
            height:
              type: integer
              minimum: 240
              maximum: 2160
          required: [width, height]
        useSavedLogin:
          type: boolean
          description: When true, hydrate the recorder browser context with the user's saved Playwright storageState (T002).
        replaySetup:
          type: boolean
          description: |
            Whether to replay the target class's stored setup-hook
            actions (OneTimeSetUpAsync, then BeforeEachAsync) before
            recording starts, so the browser begins from the post-setup
            state — e.g. already logged in — instead of the start URL.

            Only meaningful when recording a `[Test]` method into an
            existing test class that has recorded (not hand-written)
            hook actions. Omitted or true replays, which preserves the
            previous always-replay behaviour for existing clients;
            false skips replay and navigates to the start URL instead.
        captureMode:
          type: boolean
          description: When true, the session is treated as a login-capture session — finalize is short-circuited and no test code is generated (T002).
        ignoreReason:
          type: ["string", "null"]
          description: |
            When non-null, the recorded test method should be decorated
            with the language-appropriate skip/ignore attribute and the
            given reason text. Presence of this field implies "ignore =
            true"; null / omitted means the test runs normally.
        categoryConstantName:
          type: ["string", "null"]
          description: |
            Optional `PascalCase` constant name (e.g. `Smoke`) that the
            per-language codegens write into the suite's
            `TestCategories/{Suite}TestCategories` file as a
            `public const string {ConstantName} = "{categoryValue}"`.
            Must be supplied together with `categoryValue` — providing
            one without the other is rejected with HTTP 400.
        categoryValue:
          type: ["string", "null"]
          description: |
            Optional category value (e.g. `smoke-tests`) paired with
            `categoryConstantName`. The pair is both-or-neither: either
            both fields are non-empty strings, or both are null /
            omitted; mixing is rejected with HTTP 400.
        keepBrowserOpen:
          type: boolean
          description: |
            When true, Stop Recording leaves the Chromium browser alive
            in the `stopped` phase, and a successful Save / finalize
            transitions the session back into an open-browser
            pre-attach state so the next recording can attach to the
            same live browser without re-launching it. Defaults to
            false — Stop closes the browser as before.
      required: [startUrl, urlName, target]

    OpenBrowserRequest:
      type: object
      description: |
        Body for `POST /recording/open-browser`. Carries the start URL
        the browser should navigate to and an optional viewport
        override. The URL is intentionally NOT persisted to the
        project's named-URL store.
      properties:
        url: { type: string }
        viewport:
          description: Optional override for the recording browser viewport size. Falls back to the server default (1280x800) when omitted.
          type: object
          properties:
            width:
              type: integer
              minimum: 320
              maximum: 3840
            height:
              type: integer
              minimum: 240
              maximum: 2160
          required: [width, height]
      required: [url]

    AttachToOpenBrowserRequest:
      type: object
      description: |
        Body for `POST /recording/attach-to-open-browser`. Promotes an
        open-browser session into a real recording. Suite mode is forced
        to `existing` (an `existingTestClassPath` is required) and the
        target is forced to `testMethod` — any other shape is rejected
        with HTTP 400. The `viewport` field is echoed by the UI (so the
        sidebar can re-display the chosen size after attach) but is
        ignored server-side — viewport is locked at `open-browser` time.
      properties:
        existingTestClassPath: { type: string }
        methodName: { type: string }
        overwriteExistingMethod:
          type: boolean
          description: When true, the user has already consented to overwrite an existing [Test] method with the same name in the target class.
        ignoreReason:
          type: ["string", "null"]
        categoryConstantName:
          type: ["string", "null"]
        categoryValue:
          type: ["string", "null"]
        viewport:
          description: Echoed by the UI for display purposes. Ignored by the server — the viewport set at `/recording/open-browser` time wins.
          type: object
          properties:
            width:
              type: integer
              minimum: 320
              maximum: 3840
            height:
              type: integer
              minimum: 240
              maximum: 2160
          required: [width, height]
        keepBrowserOpen:
          type: boolean
          description: |
            When true, Stop Recording leaves the Chromium browser alive
            in the `stopped` phase, and a successful Save / finalize
            transitions the session back into an open-browser
            pre-attach state so the next recording attaches to the
            same live browser without re-launching it. Defaults to
            false — Stop closes the browser as before.
      required: [existingTestClassPath, methodName]

    CancelOpenBrowserResult:
      type: object
      properties:
        canceled: { type: boolean }
      required: [canceled]

    PrewarmRecordingResult:
      type: object
      properties:
        prewarming: { type: boolean }
      required: [prewarming]

    RecordingStatus:
      type: object
      properties:
        active:
          type: boolean
          description: |
            Legacy: true while the headless recording browser is live
            (i.e. `phase === "recording"`). Kept so existing clients that
            toggle UI on `active` keep working; new code should branch on
            `phase` so the `stopped` (browser closed, awaiting submit)
            state can be detected too.
        phase:
          type: string
          enum: [idle, recording, stopped]
          description: |
            `idle` when no session is loaded; `recording` while the
            browser is live; `stopped` after Stop Recording has been
            called but before `/recording/finalize`. Workbench
            affordances (Add assertion, Save, Request SDET approval)
            gate on this field.
        startUrl:
          type: ["string", "null"]
        methodName:
          type: ["string", "null"]
        target:
          type: ["string", "null"]
        targetClass:
          type: ["string", "null"]
        ownerUserId:
          type: ["string", "null"]
          description: |
            Admin-only: id of the user that owns the active recording
            session. Absent for non-admin viewers and when no session is
            active. Lets the workbench show "recording in progress by X"
            and gate the Force Discard affordance.
        ownerUsername:
          type: ["string", "null"]
          description: |
            Admin-only: username of the active recording session's
            owner. Absent for non-admin viewers and when no session is
            active. May be null if the owning user has been deleted
            since the session started.
        ownerProjectName:
          type: ["string", "null"]
          description: |
            Admin-only: solution name of the project the active
            recording session was started against. Absent for non-admin
            viewers and when no session is active.
        isOwnedByOther:
          type: boolean
          description: |
            Admin-only: true when an active recording session is held
            by a user other than the caller. The workbench only renders
            the Force Discard affordance when this is true.
        keepBrowserOpen:
          type: boolean
          description: |
            True when the active session was started (or last attached)
            with the "Keep browser open after stop" option ticked. The
            workbench uses this to warn the user before opening a
            fresh Start Recording dialog while a kept-open browser is
            still alive in the `stopped` phase.
      required: [active, phase]

    GeneratedFile:
      type: object
      properties:
        path: { type: string }
        created: { type: boolean }
      required: [path, created]

    StopRecordingRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [save, submit-for-approval]
          description: |
            How to finalize the recording. `save` (default) writes the
            generated files into the loaded project (the main project for
            admins, the user's fork for limited users). `submit-for-approval`
            additionally snapshots the fork and creates a pending submission
            in the Approval queue. Limited users must use `submit-for-approval`;
            the server rejects `save` for them.
        decision:
          type: ["object", "null"]
          properties:
            mode:
              type: string
              enum: [overwrite, rename]
            methodName:
              type: ["string", "null"]
          required: [mode]

    ArchFile:
      type: object
      properties:
        name: { type: string }
        content: { type: string }
      required: [name, content]

    ArchFolder:
      type: object
      properties:
        name: { type: string }
        folders:
          type: array
          items:
            $ref: "#/components/schemas/ArchFolder"
        files:
          type: array
          items:
            $ref: "#/components/schemas/ArchFile"
      required: [name, folders, files]

    ArchProject:
      type: object
      properties:
        id: { type: string }
        nameSuffix: { type: string }
        isTestsProject: { type: boolean }
        slnGuid: { type: string }
        folders:
          type: array
          items:
            $ref: "#/components/schemas/ArchFolder"
        files:
          type: array
          items:
            $ref: "#/components/schemas/ArchFile"
      required: [id, nameSuffix, isTestsProject, slnGuid, folders, files]

    Language:
      type: string
      enum: [csharp, python, nodejs, java, jmx]
      description: |
        Programming language a project / architecture targets. Defaults to
        `csharp` everywhere it is omitted so legacy clients keep working.
        `nodejs` produces a `@playwright/test` (TypeScript) suite. `java`
        produces a JUnit 5 + Playwright Java Maven multi-module project.
        `jmx` produces a JMeter `.jmx` test plan from captured HTTP
        traffic (no source-code project; emission only).

    SolutionType:
      type: string
      enum: [playwright, api]
      description: |
        Solution flavor. `playwright` is the historical browser-recording
        E2E flavor (every supported language). `api` is a C#-only
        xUnit + HttpClient API-test scaffold authored through the Build
        Test → AssistantBuilder dialog instead of recording.

    ApiTestBuildSpec:
      type: object
      properties:
        solutionName: { type: string }
        baseUrl: { type: string }
        urlName: { type: string }
        endpointName: { type: string }
        endpointSection:
          type: ["string", "null"]
          description: Optional nested-class name in `Constants/ApiEndpoints.cs`.
        endpointPath: { type: string }
        buildInto:
          type: string
          enum: [testMethod, oneTimeSetup, perTestSetup]
        testMethodName: { type: string }
        testClass:
          type: object
          description: |
            Either an existing test class (`mode: "existing"` + `path`) or a
            new one (`mode: "new"` + `className`).
          properties:
            mode:
              type: string
              enum: [new, existing]
            className:
              type: ["string", "null"]
            path:
              type: ["string", "null"]
          required: [mode]
        helperMethodName: { type: string }
        parameters:
          type: array
          maxItems: 10
          items:
            type: object
            properties:
              name: { type: string }
              type: { type: string }
            required: [name, type]
        httpMethod:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS]
        useAccessToken: { type: boolean }
        multipartFields:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              valueExpression: { type: string }
            required: [name, valueExpression]
        defaultHeaders:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              value: { type: string }
            required: [name, value]
      required:
        - solutionName
        - baseUrl
        - urlName
        - endpointName
        - endpointPath
        - buildInto
        - testMethodName
        - testClass
        - helperMethodName
        - parameters
        - httpMethod
        - useAccessToken
        - multipartFields
        - defaultHeaders

    ApiTestBuildResult:
      type: object
      properties:
        files:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              created: { type: boolean }
            required: [path, created]
      required: [files]

    Architecture:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        isBuiltIn: { type: boolean }
        language:
          $ref: "#/components/schemas/Language"
        solutionType:
          $ref: "#/components/schemas/SolutionType"
          description: |
            Solution flavor this architecture targets. Absent → `playwright`
            (legacy default). The New Project dialog filters its
            architecture dropdown by both `language` and `solutionType`,
            so an `api` architecture only appears when the user has
            chosen "API (HTTP-only)".
        projects:
          type: array
          items:
            $ref: "#/components/schemas/ArchProject"
      required: [id, name, isBuiltIn, projects]

    AuditEvent:
