        action:
          type: string
          enum:
            - file_create
            - file_save
            - file_delete
            - file_rename
            - folder_create
            - recording_finalize
            - approval_submit
            - approval_approve
            - approval_reject
            - fork_create
            - fork_delete
            - role_change
            - internal_test_run_start
            - internal_test_run_complete
            - recorded_action_edit
            - selector_heal
            - user_delete
            - project_git_pull
            - project_git_push
            - project_create_requested
            - project_create_approved
            - project_create_rejected
            - project_delete_requested
            - project_delete_approved
            - project_delete_rejected
            - project_delete_executed
        project:
          type: ["string", "null"]
        filePath:
          type: ["string", "null"]
        details:
          type: object
          additionalProperties: true
        userId: { type: string }
        username:
          type: ["string", "null"]
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
      required: [id, createdAt, action, project, filePath, details, userId]

    AuditEventsPage:
