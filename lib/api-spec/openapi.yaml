        href: { type: string }
      required: [totalRuns, passRate, href]
    DashboardFailingTest:
      type: object
      properties:
        projectName: { type: string }
        recordingFilePath: { type: string, nullable: true }
        failures: { type: integer }
        href: { type: string }
      required: [projectName, recordingFilePath, failures, href]
    DashboardUsersStat:
      type: object
      properties:
        activeThisWeek: { type: integer }
        newThisWindow: { type: integer }
        href: { type: string }
      required: [activeThisWeek, newThisWindow, href]
    DashboardProjectsStat:
      type: object
      properties:
        total: { type: integer }
        stale: { type: integer, description: "no runs in 30d" }
        href: { type: string }
      required: [total, stale, href]
    DashboardIntegrations:
      type: object
      properties:
        ssoUsers: { type: integer }
        localUsers: { type: integer }
        gitReposWithPat: { type: integer }
        usersHref: { type: string }
        gitReposHref: { type: string }
      required: [ssoUsers, localUsers, gitReposWithPat, usersHref, gitReposHref]
    DashboardOrgLeader:
      type: object
      properties:
        organizationId: { type: string }
        displayName: { type: string }
        runs: { type: integer }
        href: { type: string }
      required: [organizationId, displayName, runs, href]
    DashboardOrgsStat:
      type: object
      properties:
        total: { type: integer }
        leaderboard:
          type: array
          items: { $ref: "#/components/schemas/DashboardOrgLeader" }
      required: [total, leaderboard]
    DashboardSystemHealth:
      type: object
      properties:
        apiErrorRate: { type: number, description: "0..1 over last 24h; null when unknown", nullable: true }
        recentAdminActions: { type: integer }
        href: { type: string }
      required: [apiErrorRate, recentAdminActions, href]
    DashboardSummary:
      type: object
      properties:
        role:
          type: string
          # `guest` belongs here: the dashboard is the page a guest
          # lands on after signing in, so the response carries their
          # role. Omitting it made `assertResponseShape` reject every
          # guest request with a 500.
          enum: [memento_admin, admin, limited_admin, limited, guest]
        window:
          type: string
          enum: [today, "7d", "30d"]
        onboarding:
          type: object
          nullable: true
          properties:
            href: { type: string }
            label: { type: string }
          required: [href, label]
        myRecentRuns:
          type: array
          items: { $ref: "#/components/schemas/DashboardRecentRun" }
        myProjects:
          type: array
          items: { $ref: "#/components/schemas/DashboardProjectTile" }
        draftsInProgress:
          type: array
          items: { $ref: "#/components/schemas/DashboardDraft" }
        adminProjectsCount:
          type: integer
          nullable: true
          description: "Limited Admin and above: number of projects the caller administers."
        recentActivityInMyProjects:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/DashboardRecentRun" }
        orgHealth:
          $ref: "#/components/schemas/DashboardOrgHealth"
          nullable: true
        failingTests:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/DashboardFailingTest" }
        users:
          $ref: "#/components/schemas/DashboardUsersStat"
          nullable: true
        projects:
          $ref: "#/components/schemas/DashboardProjectsStat"
          nullable: true
        integrations:
          $ref: "#/components/schemas/DashboardIntegrations"
          nullable: true
        orgs:
          $ref: "#/components/schemas/DashboardOrgsStat"
          nullable: true
        systemHealth:
          $ref: "#/components/schemas/DashboardSystemHealth"
          nullable: true
      required:
        - role
        - window
        - onboarding
        - myRecentRuns
        - myProjects
        - draftsInProgress
        - adminProjectsCount
        - recentActivityInMyProjects
        - orgHealth
        - failingTests
        - users
        - projects
        - integrations
        - orgs
        - systemHealth

    JmxRecordingStartRequest:
      type: object
      description: |
        Body for `POST /jmx/recording/start`. `projectId` is treated as
        an opaque string identifier (today the URL-encoded `slnPath`
        convention used elsewhere); `jmxFileName` is the
        project-relative path of the `.jmx` file being recorded into.
        `startUrl` is optional — when supplied, the recorder navigates
        the launched browser to it immediately so the caller doesn't
        have to drive a separate `goto`. `capture` defaults to `true`
        (start CDP event capture immediately); when explicitly `false`
        the call opens the live-canvas browser in preview-only mode —
        the user can drive the page but no HTTP events are recorded
        until `POST /jmx/recording/arm` is called.
      properties:
        projectId: { type: string }
        jmxFileName: { type: string }
        startUrl:
          type: ["string", "null"]
        capture:
          type: boolean
          default: true
      required: [projectId, jmxFileName]

    JmxRecordingStatus:
      type: object
      description: |
        Snapshot of the calling user's active JMX session. `sessionId`
        is `null` when no session exists. `isCapturing` is `true` only
        once CDP event capture has been armed (via `start` with
        `capture: true`, or a later `arm` call); preview-only sessions
        report `false`.
      properties:
        sessionId:
          type: ["string", "null"]
        isCapturing:
          type: boolean
      required: [sessionId, isCapturing]

    JmxRecordingArmRequest:
      type: object
      properties:
        sessionId: { type: string }
      required: [sessionId]

    JmxRecordingArmResponse:
      type: object
      properties:
        sessionId: { type: string }
      required: [sessionId]

    JmxRecordingStartResponse:
      type: object
      properties:
        sessionId: { type: string }
      required: [sessionId]

    JmxRecordingStopRequest:
      type: object
      properties:
        sessionId: { type: string }
      required: [sessionId]

    JmxRecordingStopResponse:
      type: object
      description: |
        Result of `POST /jmx/recording/stop`. `jmxFilePath` is the
        project-root-relative path of the emitted `.jmx` plan (e.g.
        `jmx/login-flow.jmx`), or `null` when emission was skipped —
        for example, when no HTTP events were captured or when the
        project marker was missing. `warnings` carries non-fatal
        messages from the emitter / validator (credential leak refusal,
        missing marker, etc.) so the workbench can surface them.
      properties:
        sessionId: { type: string }
        eventCount: { type: integer }
        jmxFilePath:
          type: ["string", "null"]
        warnings:
          type: array
          items: { type: string }
      required: [sessionId, eventCount, jmxFilePath, warnings]

    NexusOrgConfig:
      type: object
      description: |
        Per-organization IdP partner-key status. The plaintext key
        is never returned — only `apiKeyLastFour`. `hasKey` is `false`
        when no row exists for the org (in which case the IDP
        provisioner falls back to the deployment-wide
        `NEXUS_API_KEY` env var if set).
      properties:
        organizationId: { type: string, format: uuid }
        organizationName: { type: string }
        hasKey: { type: boolean }
        apiKeyLastFour: { type: string, nullable: true }
        updatedAt: { type: string, nullable: true }
        updatedByUsername: { type: string, nullable: true }
      required:
        [
          organizationId,
          organizationName,
          hasKey,
          apiKeyLastFour,
          updatedAt,
          updatedByUsername,
        ]
    NexusOrgConfigList:
      type: array
      items: { $ref: "#/components/schemas/NexusOrgConfig" }
    TeamInvitation:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        role:
          type: string
          enum: [memento_admin, admin, limited_admin, limited]
        organizationId:
          type: ["string", "null"]
        organizationName:
          type: ["string", "null"]
        deliveryMethod:
          type: string
          enum: [email, copy_link, idp]
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, accepted, revoked, expired]
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        createdByUsername:
          type: ["string", "null"]
        acceptUrl:
          type: ["string", "null"]
          description: |
            Absolute URL the recipient visits to accept. Only present
            on the create / resend responses (so an admin can copy it
            out of band); the list response omits it.
      required:
        [id, email, role, deliveryMethod, status, expiresAt, createdAt]

    CreateTeamInvitationRequest:
      type: object
      properties:
        email:
          type: string
          description: Recipient email. Lower-cased before persisting.
        role:
          type: string
          enum: [memento_admin, admin, limited_admin, limited]
        deliveryMethod:
          type: string
          enum: [email, copy_link, idp]
        firstName: { type: string }
        lastName: { type: string }
      required: [email, role, deliveryMethod]

    CreateTeamInvitationResponse:
      type: object
      properties:
        invitation:
          $ref: "#/components/schemas/TeamInvitation"
      required: [invitation]

    CreateTeamAccessRequestRequest:
      type: object
      properties:
        requestedRole:
          type: string
          enum: [memento_admin, admin, limited_admin, limited]
        reason:
          type: string
          description: Free-text justification supplied by the user.
      required: [requestedRole]

    NexusOrgConfigInput:
      type: object
      properties:
        apiKey:
          type: string
          minLength: 1
          description: |
            IdP partner API key (`nxk_…`) minted in the identity provider and scoped
            to this organization. Stored encrypted at rest. The full
            value is never returned by any subsequent read.
      required: [apiKey]

    SelectorHealRequest:
      type: object
      properties:
        oldSelector: { type: string, minLength: 1 }
        newSelector: { type: string, minLength: 1 }
        dryRun: { type: boolean }
        via:
          type: string
          enum: [ai, repick, advanced]
          description: |
            UI path that produced the heal. Recorded in the audit
            row's `details.via` for provenance.
        aiProvider: { type: string, nullable: true }
        aiModel: { type: string, nullable: true }
        aiConfidence:
          type: string
          nullable: true
          enum: [high, medium, low]
        aiTokensIn: { type: integer, nullable: true }
        aiTokensOut: { type: integer, nullable: true }
      required: [oldSelector, newSelector]

    SelectorHealFileDetail:
      type: object
      properties:
        path: { type: string }
        replacements: { type: integer }
      required: [path, replacements]

    SelectorHealResult:
      type: object
      properties:
        recordingsChanged: { type: integer }
        totalReplacements: { type: integer }
        filesChanged: { type: integer }
        fileDetails:
          type: array
          items: { $ref: "#/components/schemas/SelectorHealFileDetail" }
        newSelector: { type: string }
      required:
        [recordingsChanged, totalReplacements, filesChanged, fileDetails, newSelector]

    AiSuggestSelectorRequest:
      type: object
      properties:
        oldSelector: { type: string, minLength: 1 }
        actionDescription: { type: string, nullable: true }
        errorMessage: { type: string, nullable: true }
        pageUrl: { type: string, nullable: true }
        domSnippet:
          type: string
          nullable: true
          description: |
            Bounded HTML snippet (≤16 KiB) captured by the validation
            runner at failure. Used to ground the AI suggestion.
        priorSteps:
          type: array
          items: { type: string }
      required: [oldSelector]

    AiSelectorSuggestion:
      type: object
      properties:
        suggestedSelector:
          type: string
          description: |
            The AI's proposed replacement selector. The client previews
            it through `/selectors/heal?dryRun=true` before any apply.
        explanation:
          type: string
          description: |
            One or two short plain-English sentences for a non-coder
            describing why this selector is a better choice.
        confidence:
          type: string
          enum: [high, medium, low]
        provider: { type: string }
        model: { type: string, nullable: true }
        tokensIn: { type: integer, nullable: true }
        tokensOut: { type: integer, nullable: true }
      required:
        [suggestedSelector, explanation, confidence, provider, model, tokensIn, tokensOut]

    AiHealAvailability:
      type: object
      properties:
        available: { type: boolean }
        reason: { type: string, nullable: true }
        message: { type: string, nullable: true }
        setupHref: { type: string, nullable: true }
        provider: { type: string, nullable: true }
      required: [available]

    RepickStartRequest:
      type: object
      properties:
        pageUrl: { type: string, format: uri }
        viewport:
          type: object
          properties:
            width: { type: integer, minimum: 320, maximum: 3840 }
            height: { type: integer, minimum: 240, maximum: 2160 }
          required: [width, height]
      required: [pageUrl]

    RepickStartResult:
      type: object
      properties:
        sessionId: { type: string }
        screenshotBase64: { type: string }
        viewport:
          type: object
          properties:
            width: { type: integer }
            height: { type: integer }
          required: [width, height]
        pageUrl: { type: string }
      required: [sessionId, screenshotBase64, viewport, pageUrl]

    RepickPickRequest:
      type: object
      properties:
        sessionId: { type: string, minLength: 1 }
        x: { type: number }
        y: { type: number }
      required: [sessionId, x, y]

    RepickPickResult:
      type: object
      properties:
        selector: { type: string }
        strategy: { type: string }
        text: { type: string, nullable: true }
        screenshotBase64: { type: string }
      required: [selector, strategy, text, screenshotBase64]

    RepickSessionRef:
      type: object
      properties:
        sessionId: { type: string, minLength: 1 }
      required: [sessionId]

    RepickScreenshot:
      type: object
      properties:
        screenshotBase64: { type: string }
      required: [screenshotBase64]

    RepickCancelResult:
      type: object
      properties:
        closed: { type: boolean }
      required: [closed]
