        name: projectName
        required: true
        schema: { type: string }
    get:
      operationId: getAiAgentProjectConfig
      tags: [ai-agent]
      summary: Read AI agent per-project config (admin only)
      responses:
        "200":
          description: Project config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiAgentProjectConfig" }
    put:
      operationId: putAiAgentProjectConfig
      tags: [ai-agent]
      summary: Toggle AI agent for a single project (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiAgentProjectConfigInput" }
      responses:
        "200":
          description: Updated project config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiAgentProjectConfig" }

  /ai-agent/projects/{projectName}/status:
    parameters:
      - in: path
        name: projectName
        required: true
        schema: { type: string }
    get:
      operationId: getAiAgentStatus
      tags: [ai-agent]
      summary: |
        Lightweight readiness check used by the workbench "Test with AI" button.
        Visible to any authenticated user with project access.
      responses:
        "200":
          description: Readiness flags
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiAgentStatus" }

  /ai-agent/projects/{projectName}/catalog:
    parameters:
      - in: path
        name: projectName
        required: true
        schema: { type: string }
    get:
      operationId: getAiAgentCatalog
      tags: [ai-agent]
      summary: Read the project's AI catalog (methods, selectors, categories) (admin only)
      responses:
        "200":
          description: Catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiAgentCatalog" }

  /ai-agent/projects/{projectName}/catalog/methods:
    parameters:
      - in: path
        name: projectName
        required: true
        schema: { type: string }
    post:
      operationId: createAiAgentCatalogMethod
      tags: [ai-agent]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiAgentCatalogMethodInput" }
      responses:
        "200":
          description: Updated catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiAgentCatalog" }

  /ai-agent/projects/{projectName}/catalog/methods/{id}:
    parameters:
      - in: path
        name: projectName
        required: true
        schema: { type: string }
      - in: path
        name: id
        required: true
        schema: { type: string }
    delete:
      operationId: deleteAiAgentCatalogMethod
      tags: [ai-agent]
      responses:
        "200":
          description: Updated catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiAgentCatalog" }

  /ai-agent/projects/{projectName}/catalog/selectors:
    parameters:
      - in: path
        name: projectName
        required: true
        schema: { type: string }
    post:
      operationId: createAiAgentCatalogSelector
      tags: [ai-agent]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiAgentCatalogSelectorInput" }
      responses:
        "200":
          description: Updated catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiAgentCatalog" }

  /ai-agent/projects/{projectName}/catalog/selectors/{id}:
    parameters:
      - in: path
        name: projectName
        required: true
        schema: { type: string }
      - in: path
        name: id
        required: true
        schema: { type: string }
    patch:
      operationId: renameAiAgentCatalogSelector
      tags: [ai-agent]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiAgentCatalogSelectorRename" }
      responses:
        "200":
          description: Updated catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiAgentCatalog" }
    delete:
      operationId: deleteAiAgentCatalogSelector
      tags: [ai-agent]
      responses:
        "200":
          description: Updated catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiAgentCatalog" }

  /ai-agent/projects/{projectName}/catalog/categories:
    parameters:
      - in: path
        name: projectName
        required: true
        schema: { type: string }
    post:
      operationId: createAiAgentCatalogCategory
      tags: [ai-agent]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiAgentCatalogCategoryInput" }
      responses:
        "200":
          description: Updated catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiAgentCatalog" }

  /ai-agent/projects/{projectName}/catalog/categories/{id}:
    parameters:
      - in: path
        name: projectName
        required: true
        schema: { type: string }
      - in: path
        name: id
        required: true
        schema: { type: string }
    delete:
      operationId: deleteAiAgentCatalogCategory
      tags: [ai-agent]
      responses:
        "200":
          description: Updated catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiAgentCatalog" }

  /ai-agent/projects/{projectName}/runs:
    parameters:
      - in: path
        name: projectName
        required: true
        schema: { type: string }
    get:
      operationId: listAiAgentRuns
      tags: [ai-agent]
      summary: List recent AI runs for the project (any project member).
      responses:
        "200":
          description: Recent runs (newest first)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiAgentRunList" }
    post:
      operationId: startAiAgentRun
      tags: [ai-agent]
      summary: Start a new AI run for the project.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiAgentRunRequest" }
      responses:
        "202":
          description: Run accepted (asynchronous)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiAgentRunAccepted" }

  /ai-agent/projects/{projectName}/runs/{runId}:
    parameters:
      - in: path
        name: projectName
        required: true
        schema: { type: string }
      - in: path
        name: runId
        required: true
        schema: { type: string }
    get:
      operationId: getAiAgentRun
      tags: [ai-agent]
      summary: Fetch a single AI run with its full report.
      responses:
        "200":
          description: Run detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiAgentRunDetail" }

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: |
        Role-tailored summary for the post-login `/dashboard` page.
        The server inspects the caller's role + active org and only
        populates fields that role is allowed to see. Higher-role
        fields are `null` for callers without the privilege.
      parameters:
        - in: query
          name: window
          required: false
          schema:
            type: string
            enum: [today, "7d", "30d"]
            default: "7d"
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /jmx/recording/status:
    get:
      operationId: getJmxRecordingStatus
      tags: [jmx]
      summary: Get the active JMX session for the current user
      description: |
        Returns the user's currently-active JMX session, if any.
        `isCapturing` is `true` when CDP event capture is armed (the
        "recording" phase) and `false` when the session is in the
        preview-only browser phase that auto-opens after a JMX project
        is created — the browser is live but HTTP events are not being
        recorded yet. Both `sessionId` and `isCapturing` are `null` /
        `false` when no session exists.
      responses:
        "200":
          description: Active session info, possibly empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JmxRecordingStatus"
        "401":
          description: Not authenticated.

  /jmx/recording/start:
    post:
      operationId: startJmxRecording
      tags: [jmx]
      summary: Start a JMX (JMeter) HTTP capture session
      description: |
        Launches a headless Chromium browser instrumented with the
        Chrome DevTools Protocol and begins capturing every top-level
        HTTP request/response pair the browser makes (XHR, Fetch, and
        top-level documents — image/font/stylesheet/media traffic is
        filtered out as noise). Returns a `sessionId` the caller passes
        back to `POST /jmx/recording/stop`. Captured events are
        persisted to a per-session row keyed by that id and consumed
        by the downstream JMX XML emitter slice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JmxRecordingStartRequest"
      responses:
        "200":
          description: Session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JmxRecordingStartResponse"
        "400":
          description: Validation error or a recording is already active for this user.
        "401":
          description: Not authenticated.

  /jmx/recording/arm:
    post:
      operationId: armJmxRecording
      tags: [jmx]
      summary: Promote a preview JMX session to active capture
      description: |
        Attaches the CDP `Network.*` listeners to an already-open
        preview session and flips `isCapturing` to `true`. Used by the
        workbench's "Start Recording" button after the auto-opened
        preview browser has been driven to the right starting state.
        Only the user who owns the session may arm it. If the session
        is already capturing, the call is a no-op.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JmxRecordingArmRequest"
      responses:
        "200":
          description: Session armed (or already armed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JmxRecordingArmResponse"
        "400":
          description: Unknown session, or caller does not own this session.
        "401":
          description: Not authenticated.

  /jmx/recording/stop:
    post:
      operationId: stopJmxRecording
      tags: [jmx]
      summary: Stop a JMX HTTP capture session and persist events
      description: |
        Closes the Chromium browser, detaches the CDP session, writes
        the captured `JmxHttpEvent[]` to the session's row, and returns
        the number of events recorded. Only the user that started the
        session may stop it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JmxRecordingStopRequest"
      responses:
        "200":
          description: Session stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JmxRecordingStopResponse"
        "400":
          description: Unknown session, or caller does not own this session.
        "401":
          description: Not authenticated.

  /nexus-config:
    get:
      operationId: listNexusOrgConfigs
      tags: [nexus-config]
      summary: |
        List IdP partner-key status for every organization the caller
        can administer. Memento Admins see every org; per-org admins
        see only the orgs where they hold an `admin` role. The
        plaintext key is never returned — only `apiKeyLastFour`. Orgs
        without a row are returned with `hasKey: false` so the UI can
        offer to set one.
      responses:
        "200":
          description: Per-org IdP key statuses (admin only).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NexusOrgConfigList" }

  /nexus-config/{orgId}:
    parameters:
      - in: path
        name: orgId
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: putNexusOrgConfig
      tags: [nexus-config]
      summary: |
        Set or rotate the IdP partner API key for one organization.
        Caller must hold `admin` (or `memento_admin`) in that org.
        The key is stored encrypted at rest with `PROJECT_SECRETS_KEY`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NexusOrgConfigInput" }
      responses:
        "200":
          description: Updated config (no plaintext key returned).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NexusOrgConfig" }
        "403":
          description: Caller is not an admin of this organization.
        "404":
          description: Organization does not exist.
    delete:
      operationId: deleteNexusOrgConfig
      tags: [nexus-config]
      summary: |
        Clear the IdP partner API key for one organization. After
        this, IDP provisioning for that org falls back to the
        deployment-wide `NEXUS_API_KEY` env var (if set).
      responses:
        "204":
          description: Removed.
        "403":
          description: Caller is not an admin of this organization.
        "404":
          description: Organization (or its config row) does not exist.

  /selectors/heal:
    post:
      operationId: healSelector
      tags: [selector-heal]
      summary: |
        Preview or apply a selector rewrite across the project's
        recordings and Selectors files. Pass `dryRun: true` for a
        preview (returns the changeset without writing). The `via`
        field tags the heal with the UI path that produced it
        (`ai` / `repick` / `advanced`) for audit provenance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectorHealRequest"
      responses:
        "200":
          description: Preview or apply result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelectorHealResult"
        "400":
          description: Invalid request body.
        "401":
          description: Unauthorized.
        "403":
          description: Caller lacks role + project assignment.
        "404":
          description: No active project loaded.

  /selectors/heal/ai-suggest:
    post:
      operationId: aiSuggestSelectorHeal
      tags: [selector-heal]
      summary: |
        Ask the project's AI Agent for a replacement selector given
        the failing step's selector, action description, error
        message, page URL, and a bounded DOM snippet. Returns the
        suggestion plus provider/model/confidence/token-count
        provenance that the caller is expected to forward back to
        `/selectors/heal` on apply so the audit row carries it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiSuggestSelectorRequest"
      responses:
        "200":
          description: AI suggestion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSelectorSuggestion"
        "400":
          description: Invalid request body.
        "401":
          description: Unauthorized.
        "403":
          description: Caller lacks role + project assignment.
        "404":
          description: No active project loaded.
        "503":
          description: AI Agent not configured for this org/project.

  /selectors/heal/ai-available:
    get:
      operationId: getAiHealAvailability
      tags: [selector-heal]
      summary: |
        Probe whether AI selector healing is usable right now (i.e.
        an AI key resolves for this org+project). Always returns 200
        with an `available` flag plus a non-coder-friendly reason +
        setup link when disabled. The UI uses this to disable the
        AI tab up-front instead of letting the user click through to
        an error.
      responses:
        "200":
          description: Availability snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiHealAvailability"
        "401":
          description: Unauthorized.
        "403":
          description: Caller lacks role + project assignment.

  /selectors/heal/repick/start:
    post:
      operationId: startSelectorRepickSession
      tags: [selector-heal]
      summary: |
        Launch a server-side Chromium session at the failing page's
        URL, with the recorder injection script applied, and return
        a screenshot the UI renders for the user to click on.
        The session auto-expires after ~5 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepickStartRequest"
      responses:
        "200":
          description: Session started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepickStartResult"
        "400":
          description: Invalid request body.
        "401":
          description: Unauthorized.
        "403":
          description: Caller lacks role + project assignment.
        "502":
          description: Failed to launch / navigate Chromium.

  /selectors/heal/repick/pick:
    post:
      operationId: pickElementInRepickSession
      tags: [selector-heal]
      summary: |
        Run the recorder's `__recorderPickElement(x, y)` at the
        supplied viewport coordinates in an open re-pick session
        and return the captured selector + a refreshed screenshot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepickPickRequest"
      responses:
        "200":
          description: Picked element.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepickPickResult"
        "400":
          description: Invalid request body.
        "401":
          description: Unauthorized.
        "403":
          description: Caller lacks role + project assignment.
        "404":
          description: |
            Session not found / expired, or no element was found
            at the supplied coordinates.

  /selectors/heal/repick/refresh:
    post:
      operationId: refreshRepickSessionScreenshot
      tags: [selector-heal]
      summary: Take a fresh screenshot of the re-pick session's page.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepickSessionRef"
      responses:
        "200":
          description: Fresh screenshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepickScreenshot"
        "401":
          description: Unauthorized.
        "404":
          description: Session not found or expired.

  /selectors/heal/repick/cancel:
    post:
      operationId: cancelSelectorRepickSession
      tags: [selector-heal]
      summary: Close a re-pick session and release its Chromium process.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepickSessionRef"
      responses:
        "200":
          description: Closed (or no-op when the session was already gone).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepickCancelResult"
        "401":
          description: Unauthorized.

components:
  schemas:
    LoginRequest:
      type: object
      properties:
        username: { type: string }
        password: { type: string }
      required: [username, password]

    AuthUser:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        role:
          type: string
          enum: [memento_admin, admin, limited_admin, limited, guest]
          description: |
            Raw value stored on `users.role`. For SSO users this is
            either `memento_admin` (god-mode, org-independent) or the
            neutral `limited` baseline — per-org authority lives on the
            membership row instead. Prefer `effectiveRole` for any
            authorization decision.

            `guest` is a throwaway trial identity minted by
            "Continue as guest". It is the lowest privilege value and is
            never IDP-assignable.
        effectiveRole:
          type: ["string", "null"]
          enum: [memento_admin, admin, limited_admin, limited, guest, null]
          description: |
            Resolved memento role for the *currently active* org.
            Precedence: `memento_admin` > local-user global role >
            per-org membership role > null. Null when the caller is an
            SSO user with no active org or no matching membership row,
            in which case the UI should treat the request as having no
            authority and prompt the user to pick an org. For guests
            this is always `guest` — they have no organizations.
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        title:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        profileComplete: { type: boolean }
        authSource:
          type: string
          enum: [local, oidc, guest]
          description: |
            Identity source for the currently signed-in user.
            `local` means seeded / username-password / dev-login;
            `oidc` means SSO-provisioned via the IDP; `guest` means a
            throwaway "Continue as guest" trial identity. Drives UI
            affordances that only make sense for one kind of account
            (e.g. the profile page renders the email as read-only and
            shows an "Update at your identity provider" link only for SSO users, and
            the "Reset password" button is enabled only for SSO users
            because the identity provider owns the reset flow).
        guestExpiresAt:
          type: ["string", "null"]
          format: date-time
          description: |
            Hard-delete deadline for a guest trial session. When this
            passes, the guest's project, user row, and browser session
            are all destroyed. Null for every non-guest account. The
            SPA renders a countdown banner from this value.
      required: [id, username, role, profileComplete, authSource]

    AdminUser:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        role:
          type: string
          enum: [memento_admin, admin, limited_admin, limited]
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        title:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        profileComplete: { type: boolean }
        lastLoginAt:
          type: ["string", "null"]
          format: date-time
        idpExternalId:
          type: ["string", "null"]
          description: |
            Opaque IDP-side identifier for users provisioned through the
            external Identity Provider. Null for local
            username/password users. The Settings → Users list uses
            this to enable or hide the "Resend welcome email" action.
        authSource:
          type: string
          enum: [local, oidc]
          description: |
            Identity source for the user. `local` means seeded /
            username-password / dev-login (global role lives on
            `users.role`); `oidc` means SSO-provisioned (authority
            comes from per-org memberships).
        memberships:
          type: array
          description: |
            The user's per-organization memberships. Empty for local
            username/password users (they keep the pre-org global view
            and have no membership rows) and for SSO users who have
            been removed from every org. Per-org roles never include
            `memento_admin` — that god-mode super role is global and
            lives on `users.role`.
          items:
            $ref: "#/components/schemas/AdminUserMembership"
      required: [id, username, role, profileComplete, lastLoginAt, memberships]

    AdminUserMembership:
      type: object
      properties:
        organizationId: { type: string }
        organizationName: { type: string }
        role:
          type: string
          enum: [admin, limited_admin, limited]
      required: [organizationId, organizationName, role]

    UpdateUserRequest:
      type: object
      description: |
        Update a user's role and/or profile fields. Two role-edit
        shapes are supported:

        * Global edit (legacy / Memento-Admin-only): `{ role }` without
          an `orgId`. Used for promoting or demoting Memento Admin
          (god-mode super role, org-independent) and for editing the
          global role of local username/password users. SSO users with
          a non-`memento_admin` role MUST include `orgId` — the server
          will reject a roleless-org edit with HTTP 400.
        * Per-org edit: `{ orgId, role }`. The role must be one of
          `admin`, `limited_admin`, or `limited`. Updates the target
          user's `user_organizations` row for the given org. Only an
          admin (Memento Admin, full Admin, or Limited Admin) of that
          org may edit memberships within it; Memento Admins can edit
          any org.
      properties:
        role:
          type: string
          enum: [memento_admin, admin, limited_admin, limited]
        orgId:
          type: string
          description: |
            When set, the `role` change is applied to the target user's
            membership row in this organization rather than to the
            global `users.role` column. Required for editing the role
            of any SSO user other than the Memento Admin promotion
            path.
        firstName: { type: string }
        lastName: { type: string }
        title: { type: string }
        email: { type: string }

    CreateUserRequest:
      type: object
      properties:
        username: { type: string }
        role:
          type: string
          enum: [memento_admin, admin, limited_admin, limited]
        firstName: { type: string }
        lastName: { type: string }
        email:
          type: string
          description: |
            Email address for the new user. Required when
            `provisionInIdp` is true (the configured IDP — currently
            the identity provider — needs an email to create the account). Optional and
            ignored for local-only user creation.
        provisionInIdp:
          type: boolean
          description: |
            When true, the new user is provisioned in the configured
            external Identity Provider via the server's
            `IdpUserProvisioner` port instead of the local users table.
            Requires `IDP_PROVISIONING_ENABLED=1` and `NEXUS_API_BASE_URL`
            on the server. Each provisioning call is authorized with
            the *calling admin's* OIDC access token (token delegation,
            no shared service account), so the caller must be signed
            in via SSO and have an active organization picked — see
            `canProvisionInIdp` on the AuthMe response. Local
            username/password admins receive a 403 on this path. When
            `NEXUS_API_BASE_URL` is missing the stub adapter returns a
            clear "IDP not configured" error.
      required: [username, role]

    CreateUserResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AdminUser"
        temporaryPassword:
          type: ["string", "null"]
          description: |
            Temporary password to share with the new user on first
            sign-in. Null when the user was provisioned in an external
            IDP (the IDP owns the credential lifecycle in that case).
        provisionedInIdp:
          type: boolean
          description: |
            True when the user was created in the external IDP rather
            than the local users table. Defaults to false.
        idpExternalId:
          type: ["string", "null"]
          description: |
            Opaque identifier returned by the IDP for the newly-created
            user, when `provisionedInIdp` is true. memento does not
            interpret this value.
      required: [user, temporaryPassword]

    InviteUserRequest:
      type: object
      properties:
        email:
          type: string
          description: |
            Email address to invite. Becomes the recipient's identity provider
            username when they accept and self-register.
        firstName: { type: string }
        lastName: { type: string }
      required: [email]

    InviteUserResponse:
      type: object
      properties:
        email:
          type: string
          description: Lower-cased email the identity provider echoed back.
        expiresAt:
          type: string
          format: date-time
          description: |
            When the invitation expires. After this point the
            recipient must be re-invited.
      required: [email, expiresAt]

    ResendWelcomeResponse:
      type: object
      properties:
        message: { type: string }
        lastResentAt:
          type: ["string", "null"]
          format: date-time
        resendCount:
          type: ["integer", "null"]
      required: [message]

    ResendWelcomeThrottledResponse:
      type: object
      properties:
        error: { type: string }
        retryAfterSeconds:
          type: ["integer", "null"]
        lastResentAt:
          type: ["string", "null"]
          format: date-time
        resendCount:
          type: ["integer", "null"]
      required: [error]

    PasswordResetResponse:
      type: object
      description: |
        Always an empty object on success — the identity provider owns the reset UI,
        so memento has nothing else to return.
      properties: {}

    PasswordResetThrottledResponse:
      type: object
      properties:
        error: { type: string }
        retryAfterSeconds:
          type: ["integer", "null"]
      required: [error]

    UpdateProfileRequest:
      type: object
      properties:
        firstName: { type: string }
        lastName: { type: string }
        title: { type: string }
        email: { type: string }
      required: [firstName, lastName, title, email]

    LoginResult:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
      required: [user]

    # Named `…Result`, not `…Response`: orval derives the zod response
    # validator's name from the operationId (`continueAsGuest` →
    # `ContinueAsGuestResponse`), so a component with that exact name
    # collides on re-export. Same reason `LoginResult` is spelled that
    # way rather than `LoginResponse`.
    ContinueAsGuestResult:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        expiresAt:
          type: string
          format: date-time
          description: |
            When this guest session and its project are hard-deleted.
            Mirrors `user.guestExpiresAt`.
      required: [user, expiresAt]

    GuestCapacityError:
      type: object
      description: |
        Returned by `POST /auth/guest` when every guest slot in the
        deployment is currently occupied. The cap is global, not
        per-visitor.
      properties:
        error:
          type: string
          description: Human-readable message suitable for display.
        code:
          type: string
          enum: [GUEST_CAPACITY]
      required: [error, code]

    AuthMeResponse:
      type: object
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
        organizations:
          type: array
          description: |
            Organizations the IDP reported for the calling user on the
            most recent SSO sync. Always empty for local
            username/password users — they have no IDP-driven org
            membership and the rest of memento behaves exactly as the
            local-only build did.
          items:
            $ref: "#/components/schemas/AuthOrganization"
        activeOrganizationId:
          type: ["string", "null"]
          description: |
            The organization the caller is currently acting in, or null
            for local users / IDP users who still need to pick one.
        ssoEnabled:
          type: boolean
          description: |
            True when the OIDC env vars are configured. The login page
            uses this to decide whether to render the "Sign in with
            SSO" button.
        idpProvisioningEnabled:
          type: boolean
          description: |
            True when `IDP_PROVISIONING_ENABLED` is set on the server
            and a real IDP user-provisioner adapter is wired up. Server-
            side toggle only — see `canProvisionInIdp` for whether the
            *current* caller is allowed to use it.
        canProvisionInIdp:
          type: boolean
          description: |
            True when this specific caller can create users in the IDP.
            Requires (1) `idpProvisioningEnabled` true on the server,
            (2) the caller is an admin, (3) the server has an IdP
            partner API key configured (`NEXUS_API_KEY`), and (4) the
            caller has an active organization picked. memento
            authenticates to the identity provider with the server-side API key, so
            local username/password admins are now eligible too — the
            old "must be SSO" requirement was removed when the adapter
            switched away from per-admin token delegation. The Add user
            dialog hides the IDP path entirely when this is false and
            only offers the local backdoor; the route also enforces it
            server-side (503 if the API key is missing, 403 if no
            active org).
      required:
        [user, organizations, activeOrganizationId, ssoEnabled, idpProvisioningEnabled, canProvisionInIdp]

    AuthOrganization:
      type: object
      properties:
        id: { type: string }
        externalKey:
          type: string
          description: Raw value of the org claim from the IDP.
        displayName: { type: string }
        role:
          type: ["string", "null"]
          enum: [admin, limited_admin, limited, null]
          description: |
            The caller's memento role *within this organization*, as
            written by the OIDC provisioner from the IDP's per-org
            role claim. Per-org roles never carry `memento_admin`
            (that god-mode super role is org-independent and lives on
            `users.role`). Null when the row is a local-user pseudo-
            membership (today: never, since local users have no
            membership rows) so the UI can render "Admin in OrgA,
            Limited Admin in OrgB" directly from this list.
      required: [id, externalKey, displayName]

    SetActiveOrgRequestBody:
      type: object
      properties:
        organizationId: { type: string }
      required: [organizationId]

    SetActiveOrgResultBody:
      type: object
      properties:
        activeOrganizationId: { type: string }
      required: [activeOrganizationId]

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Project:
      type: object
      properties:
        solutionName: { type: string }
        testProjectName: { type: string }
        namespace: { type: string }
        rootPath: { type: string }
        slnPath: { type: string }
        language:
          $ref: "#/components/schemas/Language"
        solutionType:
          $ref: "#/components/schemas/SolutionType"
        jmxFiles:
          type: array
          description: |
            JMX-only. Project-root-relative paths of emitted `.jmx`
            plans (e.g. `jmx/login-flow.jmx`), in the order the
            emitter wrote them. Mirrors `.testbuilder.json#jmxFiles`
            so the workbench file explorer can list and download
            them without reading the marker itself. Absent for
            non-JMX projects.
          items: { type: string }
        jmxEmbedCredentials:
          type: boolean
          description: |
            JMX-only. `true` when the project's saved
            `jmxExport.embedCredentials` flag is on — the workbench
            uses this to show a "credentials in plaintext XML"
            warning above the export action. Defaults to `false`
            when the marker omits it; absent for non-JMX projects.
        targetUrl:
          type: string
          description: |
            JMX-only. The project's target HTTP origin captured at
            create time. Used by the JMX live-recording canvas as
            the initial navigation URL when the user starts a
            recording. Absent for non-JMX projects.
        jwtAuth:
          type: boolean
          description: |
            JMX-only. Mirrors the marker's `jwtAuth` flag. Absent
            for non-JMX projects.
        bff:
          type: boolean
          description: |
            JMX-only. Mirrors the marker's `bff` flag — `true` when
            the project was created with the BFF (Backend-for-Frontend)
            auth toggle enabled. Downstream recording / IR /
            correlation features branch on this to enable BFF-aware
            OAuth, CSRF, and storageState capture. Absent for non-JMX
            projects.
      required: [solutionName, testProjectName, namespace, rootPath, slnPath]

    CurrentProjectResponse:
      type: object
      properties:
        project:
          oneOf:
            - $ref: "#/components/schemas/Project"
            - type: "null"
      required: [project]

    CreateProjectRequest:
      type: object
      properties:
        solutionName: { type: string }
        testProjectName: { type: string }
        namespace: { type: string }
        architectureId:
          type: ["string", "null"]
          description: ID of the architecture to scaffold from. Defaults to "default".
        language:
          $ref: "#/components/schemas/Language"
        solutionType:
          $ref: "#/components/schemas/SolutionType"
        targetUrl:
          type: string
          description: |
            JMX-only. Required when `language` is `jmx`. The target HTTP
            origin that captured request URLs are rewritten against
            when the JMeter `.jmx` plan is emitted (e.g.
            `https://example.com`). Ignored for non-JMX languages.
        jwtAuth:
          type: boolean
          description: |
            JMX-only. When `true`, the emitted plan wires the captured
            login response into a JWT-bearer header for subsequent
            samplers. Defaults to `false`. Ignored for non-JMX
            languages.
        bff:
          type: boolean
          description: |
            JMX-only. When `true`, the project is marked as a
            BFF-style (Backend-for-Frontend) auth project, enabling
            BFF-aware OAuth/CSRF/storageState capture in downstream
            recording and emission features. Persisted on the
            `.testbuilder.json` marker as `bff: true`. Defaults to
            `false`. Ignored for non-JMX languages.
      required: [solutionName, testProjectName, namespace]

    CloneProjectFromRepoRequest:
      type: object
      description: |
        Clone an existing Git repo into a new project. Same shape as
        `ProjectGitConfigInput` plus a `solutionName` for the project
        directory and row.
      properties:
        solutionName:
          type: string
          description: |
            Folder name for the new project under the workspace. Must
            match the same identifier rules as `createProject`.
        provider:
          type: string
          enum: [azure_repos, github, existing_pat]
          description: |
            Provider mode. `azure_repos` / `github` use the inline
            `pat`; `existing_pat` resolves credentials from the shared
            Repo PAT referenced by `repoPatId`.
        repoUrl: { type: string }
        branch: { type: string }
        pat:
          type: ["string", "null"]
          description: |
            Personal Access Token. Required when `provider` is
            `azure_repos` or `github`; ignored when `provider` is
            `existing_pat`.
        repoPatId:
          type: ["string", "null"]
          format: uuid
          description: |
            Required when `provider` is `existing_pat`. References a
            row in `/repo-pats`.
      required: [solutionName, repoUrl, branch]

    CloneProjectFromRepoError:
      type: object
      properties:
        errorCode:
          type: string
          enum:
            - auth_failed
            - repo_not_found
            - branch_not_found
            - project_exists
            - invalid_input
            - git_failed
        message: { type: string }
      required: [errorCode, message]

    LoadProjectRequest:
      type: object
      properties:
        slnPath: { type: string }
      required: [slnPath]

    AvailableProject:
      type: object
      properties:
        slnPath: { type: string }
        solutionName: { type: string }
        disabled: { type: boolean }
        hasAccess: { type: boolean }
        hasPendingRequest: { type: boolean }
        pendingApproval: { type: boolean }
        language:
          $ref: "#/components/schemas/Language"
        solutionType:
          $ref: "#/components/schemas/SolutionType"
        pendingDeletion:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/PendingDeletion"
          description: |
            When set, an admin-approval delete request is open against
            this project. The project remains visible and loadable
            until an approver decides the request.
        pendingClearFiles:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/PendingDeletion"
          description: |
            When set, an admin-approval clear-files request is open
            against this project. The project remains usable until an
            approver decides the request. Reuses the PendingDeletion
            shape because the metadata (requester + timestamp) is the
            same.
      required: [slnPath, solutionName, disabled]

    ProjectLifecycleRequestKind:
      type: string
      enum: [create, delete, clear_files]

    ProjectLifecycleRequestStatus:
      type: string
      enum: [pending, approved, rejected]

    PendingDeletion:
      type: object
      properties:
        requestId: { type: string }
        requestedByUserId: { type: string }
        requestedByUsername: { type: string }
        requestedAt: { type: string, format: date-time }
        isOwnRequest: { type: boolean }
      required:
        [requestId, requestedByUserId, requestedByUsername, requestedAt, isOwnRequest]

    ProjectLifecycleRequest:
      type: object
      properties:
        id: { type: string }
        projectName: { type: string }
        kind:
          $ref: "#/components/schemas/ProjectLifecycleRequestKind"
        status:
          $ref: "#/components/schemas/ProjectLifecycleRequestStatus"
        requestedByUserId: { type: string }
        requestedByUsername: { type: string }
        requestedByRole:
          type: string
          enum: [memento_admin, admin, limited_admin, limited]
        requestedAt: { type: string, format: date-time }
        decidedAt:
          type: ["string", "null"]
          format: date-time
        decidedByUserId:
          type: ["string", "null"]
        decidedByUsername:
          type: ["string", "null"]
        decisionNote:
          type: ["string", "null"]
        organizationId:
          type: ["string", "null"]
        language:
          type: ["string", "null"]
        solutionType:
          type: ["string", "null"]
      required:
        - id
        - projectName
        - kind
        - status
        - requestedByUserId
        - requestedByUsername
        - requestedByRole
        - requestedAt

    DecideLifecycleRequestRequest:
      type: object
      properties:
        note: { type: string }

    CreateProjectPendingResponse:
      type: object
      properties:
        pending:
          type: boolean
          enum: [true]
        request:
          $ref: "#/components/schemas/ProjectLifecycleRequest"
      required: [pending, request]

    DeleteProjectPreflightResponse:
      type: object
      properties:
        requiresApproval: { type: boolean }
        isSoleAdmin: { type: boolean }
        hasPendingRequest: { type: boolean }
      required: [requiresApproval, isSoleAdmin]

    ProjectAssignment:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        username: { type: string }
        projectName: { type: string }
        assignedBy: { type: string }
        assignedAt: { type: string, format: date-time }
      required:
        [id, userId, username, projectName, assignedBy, assignedAt]

    CreateProjectAssignmentRequest:
      type: object
      properties:
        userId: { type: string }
        projectName: { type: string }
      required: [userId, projectName]

    AccessRequestStatus:
      type: string
      enum: [pending, approved, denied]

    ProjectAccessRequest:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        username: { type: string }
        projectName: { type: string }
        status:
          $ref: "#/components/schemas/AccessRequestStatus"
        requestedAt: { type: string, format: date-time }
        decidedAt:
          type: ["string", "null"]
          format: date-time
        decidedBy:
          type: ["string", "null"]
        note:
          type: ["string", "null"]
      required:
        [id, userId, username, projectName, status, requestedAt]

    CreateAccessRequestRequest:
      type: object
      properties:
        projectName: { type: string }
      required: [projectName]

    DecideAccessRequestRequest:
      type: object
      properties:
        note: { type: string }

    SetProjectDisabledRequest:
      type: object
      properties:
        slnPath: { type: string }
        disabled: { type: boolean }
      required: [slnPath, disabled]

    DeleteProjectRequest:
      type: object
      properties:
        slnPath: { type: string }
        acknowledgeIrreversible:
          type: boolean
          description: |
            Required when the caller is the sole admin in their org and
            the deletion will run immediately (no approver available).
            Ignored when the call creates a pending approval request.
      required: [slnPath]

    ClearProjectFilesRequest:
      type: object
      properties:
        slnPath: { type: string }
        acknowledgeIrreversible:
          type: boolean
          description: |
            Required when the caller is the sole admin in their org and
            the clear-files will run immediately (no approver available).
            Ignored when the call creates a pending approval request.
      required: [slnPath]

    ClearProjectFilesPreflightResponse:
      type: object
      properties:
        requiresApproval: { type: boolean }
        isSoleAdmin: { type: boolean }
        hasPendingRequest: { type: boolean }
      required: [requiresApproval, isSoleAdmin]

    ProjectGitConfig:
      type: object
      properties:
        provider:
          type: string
          enum: [azure_repos, github]
          description: |
            Effective provider for git operations. For shared-PAT rows
            this mirrors the referenced Repo PAT's provider.
        repoUrl: { type: string }
        branch: { type: string }
        patSetAt:
          type: ["string", "null"]
          format: date-time
          description: |
            When the inline PAT on this row was last stored. Always
            null for rows bound to a shared Repo PAT (`repoPatId` is
            set instead).
        patLastFour:
          type: ["string", "null"]
          description: |
            Last four characters of the effective PAT — either from
            this row's inline PAT or, for shared-PAT rows, mirrored
            from the linked Repo PAT so the UI can render the same
            "•••XXXX" hint in both modes.
        repoPatId:
          type: ["string", "null"]
          format: uuid
          description: |
            When non-null, the project resolves its PAT from this
            shared Repo PAT row at request time instead of from an
            inline PAT. Mutually exclusive with `patSetAt` (and with
            the inline `patEncrypted` ciphertext stored server-side).
        repoPatName:
          type: ["string", "null"]
          description: |
            Display name of the referenced Repo PAT. Populated only
            when `repoPatId` is set. Allows the UI to render
            "Existing PAT: {Provider} - {name}" without a second
            request.
      required: [provider, repoUrl, branch, patSetAt, patLastFour]

    ProjectGitConfigInput:
      type: object
      properties:
        provider:
          type: string
          enum: [azure_repos, github, existing_pat]
          description: |
            Provider mode for this project. `azure_repos` and `github`
            store an inline PAT on the row. `existing_pat` binds the
            row to a shared `repo_pats` entry identified by
            `repoPatId`; the effective git provider is taken from
            that PAT. Defaults to `azure_repos` for back-compat.
        repoUrl: { type: string }
        branch: { type: string }
        pat:
          type: ["string", "null"]
          description: |
            New Personal Access Token. Send `null` (or omit) to keep the
            existing PAT when only updating the URL or branch. Ignored
            when `provider` is `existing_pat`.
        repoPatId:
          type: ["string", "null"]
          format: uuid
          description: |
            Required when `provider` is `existing_pat`. References a
            row in `/repo-pats`. The inline PAT fields are cleared
            when this is set.
      required: [repoUrl, branch]

    ProjectGitPullResult:
      type: object
      properties:
        ok: { type: boolean }
        commitSha:
          type: ["string", "null"]
        commitMessage:
          type: ["string", "null"]
        errorCode:
          type: ["string", "null"]
          enum:
            - auth_failed
            - repo_not_found
            - branch_not_found
            - not_a_memento_project
            - git_failed
            - null
        message:
          type: ["string", "null"]
      required: [ok]

    ProjectGitPushBody:
      type: object
      properties:
        commitMessage:
          type: string
          minLength: 1
          description: Commit message for the new commit pushed to the remote.
      required: [commitMessage]

    ProjectGitPushResult:
      type: object
      properties:
        ok: { type: boolean }
        commitSha:
          type: ["string", "null"]
          description: SHA of the new commit, or null when there was nothing to push.
        nothingToCommit:
          type: ["boolean", "null"]
          description: |
            True when the working tree matched the remote branch and no
            commit/push was needed.
        errorCode:
          type: ["string", "null"]
          enum:
            - auth_failed
            - repo_not_found
            - branch_not_found
            - push_rejected
            - git_failed
            - null
          description: |
            `push_rejected` means the remote branch moved ahead of the
            local copy (non-fast-forward) — pull first, then retry.
        message:
          type: ["string", "null"]
      required: [ok]

    ProjectBranchList:
      type: object
      properties:
        hasGitWorkingCopy: { type: boolean }
        current:
          type: ["string", "null"]
        branches:
          type: array
          items: { type: string }
      required: [hasGitWorkingCopy, current, branches]

    CreateBranchInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        checkout: { type: boolean }
      required: [name]

    CheckoutBranchInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        force:
          type: boolean
          description: |
            When true, discard uncommitted changes in the working copy
            before switching. Defaults to false.
      required: [name]

    ProjectBranchOpResult:
      type: object
      properties:
        ok: { type: boolean }
        current:
          type: ["string", "null"]
          description: The current branch after the operation, if known.
        errorCode:
          type: ["string", "null"]
          enum:
            - no_git_working_copy
            - invalid_name
            - already_exists
            - not_found
            - dirty_working_copy
            - git_failed
            - null
        message:
          type: ["string", "null"]
      required: [ok]

    UserProjectFork:
      type: object
      properties:
        configured:
          type: boolean
          description: True when the user has saved a personal fork for this project.
        provider:
          type: ["string", "null"]
          enum: [azure_repos, github, null]
        repoUrl:
          type: ["string", "null"]
        patSetAt:
          type: ["string", "null"]
          format: date-time
        patLastFour:
          type: ["string", "null"]
      required: [configured, provider, repoUrl, patSetAt, patLastFour]

    UserProjectForkInput:
      type: object
      properties:
        provider:
          type: string
          enum: [azure_repos, github]
        repoUrl:
          type: string
          minLength: 1
        pat:
          type: ["string", "null"]
          description: |
            New Personal Access Token. Send `null` (or omit) to keep
            the existing PAT when only updating the URL or provider.
      required: [provider, repoUrl]

    SsoAccessRequestInput:
      type: object
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
          description: Email address the requester typed into the form.
        gate:
          type: string
          enum: [no_memento_user, no_memento_access, no_org]
          description: Which deny gate the requester is asking to bypass.
        orgKey:
          type: ["string", "null"]
          description: |
            Bound org `externalKey` from the deny redirect, if any. Sent
            verbatim from the SSO deny banner.
        message:
          type: ["string", "null"]
          maxLength: 2000
          description: Optional free-text justification.
      required: [email, gate]

    SsoAccessRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        gate:
          type: string
          enum: [no_memento_user, no_memento_access, no_org]
        orgKey: { type: ["string", "null"] }
        message: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        resolvedAt:
          type: ["string", "null"]
          format: date-time
          description: |
            When an admin marked this request handled. Null while the
            row is still pending.
        resolvedByUserId:
          type: ["string", "null"]
          format: uuid
          description: |
            `users.id` of the admin who marked the row handled, or
            null while pending.
        resolvedByEmail:
          type: ["string", "null"]
          description: |
            Convenience denormalization — the email of the resolving
            admin, or null while pending / when the user row is gone.
      required:
        [
          id,
          email,
          gate,
          orgKey,
          message,
          createdAt,
          resolvedAt,
          resolvedByUserId,
          resolvedByEmail,
        ]

    SsoAccessRequestUpdateInput:
      type: object
      properties:
        resolution:
          type: string
          enum: [resolved, dismissed, pending]
          description: |
            `resolved` and `dismissed` both mark the row handled (the
            distinction is purely audit-trail intent and not surfaced
            separately today). `pending` reopens the row.
      required: [resolution]

    SsoDenial:
      type: object
      properties:
        id: { type: string, format: uuid }
        subject:
          type: string
          description: Stable IDP user identifier (the `sub` claim).
        email:
          type: ["string", "null"]
          description: Email from IDP claims if present. Best-effort.
        gate:
          type: string
          enum: [no_memento_user, no_memento_access, no_org]
          description: Which claim gate rejected the sign-in.
        orgKey:
          type: ["string", "null"]
          description: Bound org id from the IDP claims, if any.
        createdAt: { type: string, format: date-time }
        handledAt:
          type: ["string", "null"]
          format: date-time
          description: |
            When an admin marked this denial as handled, or null while
            still open.
        handledByUsername:
          type: ["string", "null"]
          description: |
            Username of the admin who handled the denial. Null while
            still open, or if the handler's account has since been
            deleted (the handled-at timestamp is preserved).
      required:
        [id, subject, email, gate, orgKey, createdAt, handledAt, handledByUsername]

    SsoDenialUpdate:
      type: object
      properties:
        handled:
          type: boolean
          description: |
            True to mark this denial as handled (dismiss it from the
            default queue), false to reopen a previously-handled row.
      required: [handled]

    RepoPat:
      type: object
      properties:
        id: { type: string, format: uuid }
        provider:
          type: string
          enum: [azure_repos, github]
        name: { type: string }
        patLastFour: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, provider, name, patLastFour, createdAt, updatedAt]

    RepoPatInput:
      type: object
      properties:
        provider:
          type: string
          enum: [azure_repos, github]
        name:
          type: string
          minLength: 1
        pat:
          type: string
          minLength: 1
          description: Plaintext Personal Access Token. Encrypted at rest.
      required: [provider, name, pat]

    RepoPatUpdateInput:
      type: object
      properties:
        provider:
          type: string
          enum: [azure_repos, github]
        name:
          type: string
          minLength: 1
        pat:
          type: ["string", "null"]
          description: |
            New Personal Access Token. Send `null` (or omit) to keep
            the existing PAT when only renaming or switching provider.
      required: [provider, name]

    DeleteRepoPatConflict:
      type: object
      properties:
        error: { type: string }
        boundProjects:
          type: array
