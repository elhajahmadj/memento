openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: project
    description: Project scaffolding and lifecycle
  - name: files
    description: File and folder management
  - name: codegen
    description: C# test code generation
  - name: recording
    description: Browser recording sessions
  - name: architecture
    description: Project architecture templates
  - name: auth
    description: Authentication and session management
  - name: users
    description: Admin user management
  - name: audit
    description: Audit log of file changes and admin actions
  - name: settings
    description: Workspace-wide user settings
  - name: admin
    description: Admin-only system observability endpoints
  - name: tests
    description: Test discovery and selection-based runs across all supported languages
  - name: dashboard
    description: Role-tailored post-login dashboard summary
  - name: jmx
    description: JMX (JMeter) recording and emission
  - name: nexus-config
    description: Per-organization IdP partner API key configuration
  - name: team
    description: Plain-language team admin (invitations, access requests)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Authenticate with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "401":
          description: Invalid credentials

  /auth/guest:
    post:
      operationId: continueAsGuest
      tags: [auth]
      summary: Start a throwaway guest trial session
      description: |
        Mints an anonymous trial identity bound to the caller's browser
        session. No credentials are required. The guest may scaffold and
        record exactly one project and export it; AI features and all
        setup surfaces are closed to them.

        The session and its project are hard-deleted 6 hours after
        creation. A deployment-wide cap limits how many guest sessions
        can be active simultaneously; when it is full this returns 429
        rather than signing anyone in.

        Calling this while already holding a live guest session returns
        that session instead of consuming a second slot.
      responses:
        "200":
          description: Guest session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContinueAsGuestResult"
        "429":
          description: Every guest slot is currently in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestCapacityError"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "204":
          description: Logged out

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the currently authenticated user (or null)
      responses:
        "200":
          description: Current user (or null)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"

  /auth/active-org:
    post:
      operationId: setActiveOrg
      tags: [auth]
      summary: |
        Switch the calling IDP user's active organization. Local users
        cannot call this — they don't carry an active org. Returns 400
        if the user isn't a member of the requested org.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetActiveOrgRequestBody"
      responses:
        "200":
          description: Active org updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetActiveOrgResultBody"
        "400":
          description: Invalid org id or non-member
        "401":
          description: Unauthorized

  /auth/password-reset:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: |
        Ask the configured Identity Provider to email the
        signed-in user a password-reset link. Memento never sees the
        new password — the identity provider owns the reset UI. SSO accounts only;
        local username/password accounts get 409.
      responses:
        "200":
          description: Reset email requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetResponse"
        "401":
          description: Unauthorized
        "409":
          description: Action not available for local username/password accounts
        "429":
          description: |
            The caller (or the IDP) is rate-limiting password-reset
            requests. The body includes `retryAfterSeconds` and the
            `Retry-After` HTTP header is set when applicable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetThrottledResponse"
        "502":
          description: The IDP refused or could not be reached
        "503":
          description: |
            the identity provider is not configured on this server
            (`NEXUS_API_BASE_URL` is missing).

  /auth/profile:
    put:
      operationId: updateProfile
      tags: [auth]
      summary: Update the current user's profile (first name, last name, title, email)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Invalid profile
        "401":
          description: Unauthorized

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List every user (admin only)
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "403":
          description: Forbidden
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user with a temporary password (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateUserResponse"
        "400":
          description: Invalid request
        "403":
          description: Forbidden
        "409":
          description: Username already taken

  /users/invite:
    post:
      operationId: inviteUser
      tags: [users]
      summary: |
        Send an IdP invitation email so the recipient self-registers
        (Step 2c in the IdP partner integration docs). Unlike
        `POST /users` with `provisionInIdp=true`, no user row is
        created in the identity provider or memento until the recipient accepts the
        invitation link. Admin-only and SSO-gated like the create
        path; requires an active organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteUserRequest"
      responses:
        "201":
          description: Invitation sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteUserResponse"
        "400":
          description: |
            Invalid request — missing/malformed email, or IDP
            provisioning is not enabled on this server
            (IDP_PROVISIONING_ENABLED is off).
        "403":
          description: |
            Forbidden — caller is not an admin, did not sign in via
            SSO, or has no active organization selected.
        "409":
          description: |
            An active invitation already exists for this email in this
            organization. The original invitation is still valid.
        "502":
          description: Upstream the identity provider call failed.
        "503":
          description: |
            No IdP partner API key is configured for this
            organization.

  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user's role and/or profile fields (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          description: Invalid request (bad fields, or self-demote that would leave zero admins)
        "403":
          description: Forbidden
        "404":
          description: Not found
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user account (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "400":
          description: Invalid request (e.g. deleting yourself or the last admin)
        "403":
          description: Forbidden
        "404":
          description: Not found
        "409":
          description: User has dependent records that block deletion

  /users/{id}/resend-welcome:
    post:
      operationId: resendWelcomeEmail
      tags: [users]
      summary: |
        Resend the IDP welcome (registration) email for a user that was
        provisioned through the external Identity Provider. Admin only.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Welcome email re-sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResendWelcomeResponse"
        "400":
          description: |
            User was not provisioned through the IDP, or IDP provisioning
            is disabled on this server.
        "403":
          description: Forbidden
        "404":
          description: Not found
        "429":
          description: |
            Throttled by the IDP. The body includes `retryAfterSeconds`
            and the `Retry-After` HTTP header is set when applicable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResendWelcomeThrottledResponse"
        "501":
          description: |
            IDP provisioning is enabled but no concrete adapter is wired
            up (the stub adapter is still installed).
        "502":
          description: IDP refused the request

  /team/invitations:
    get:
      operationId: listTeamInvitations
      tags: [team]
      summary: List pending team invitations (admin only).
      responses:
        "200":
          description: Pending invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamInvitation"
        "403":
          description: Forbidden
    post:
      operationId: createTeamInvitation
      tags: [team]
      summary: |
        Invite a teammate. Consolidated entry point for all three
        invite delivery methods (email, copy-link, IDP). Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamInvitationRequest"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTeamInvitationResponse"
        "400":
          description: Invalid request
        "403":
          description: Forbidden
        "409":
          description: An active invitation already exists for this email

  /team/invitations/{id}:
    delete:
      operationId: revokeTeamInvitation
      tags: [team]
      summary: Revoke a pending invitation (admin only).
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Revoked
        "404":
          description: Not found

  /team/invitations/{id}/resend:
    post:
      operationId: resendTeamInvitation
      tags: [team]
      summary: |
        Rotate the invite token and re-deliver. Admin only.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Invitation re-issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTeamInvitationResponse"
        "404":
          description: Not found

  /team/access-requests:
    post:
      operationId: createTeamAccessRequest
      tags: [team]
      summary: |
        Submit an in-app request to upgrade the current user's team
        role / access. Notifies admins; never elevates the caller on
        its own.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamAccessRequestRequest"
      responses:
        "202":
          description: Request received

  /projects/current:
    get:
      operationId: getCurrentProject
      tags: [project]
      summary: Get the currently loaded project
      responses:
        "200":
          description: Current project (or null)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentProjectResponse"

  /projects:
    post:
      operationId: createProject
      tags: [project]
      summary: |
        Scaffold a new C# Playwright + NUnit solution. Admin and
        Memento Admin callers (and local users with no org) get an
        immediate 201 with the created project. Other signed-in callers
        with an active org get a 202 with a pending lifecycle request
        — the project is reserved but not visible until an admin
        approves it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "202":
          description: Pending admin approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateProjectPendingResponse"

  /projects/lifecycle-requests:
    get:
      operationId: listProjectLifecycleRequests
      tags: [project-lifecycle-requests]
      summary: |
        List project lifecycle requests. Admins see pending requests in
        their org scope; other signed-in users see only their own
        requests (every status).
      parameters:
        - in: query
          name: status
          required: false
          schema:
            $ref: "#/components/schemas/ProjectLifecycleRequestStatus"
        - in: query
          name: mine
          required: false
          schema: { type: boolean }
          description: When `true`, return only the caller's own requests.
      responses:
        "200":
          description: Lifecycle requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectLifecycleRequest"

  /projects/lifecycle-requests/{id}/approve:
    post:
      operationId: approveProjectLifecycleRequest
      tags: [project-lifecycle-requests]
      summary: Approve a pending create request (admin only).
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideLifecycleRequestRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectLifecycleRequest"

  /projects/lifecycle-requests/{id}/reject:
    post:
      operationId: rejectProjectLifecycleRequest
      tags: [project-lifecycle-requests]
      summary: |
        Reject a pending create request (admin only). The scaffolded
        project directory and its org stamp are removed.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideLifecycleRequestRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectLifecycleRequest"

  /projects/lifecycle-requests/{id}:
    delete:
      operationId: cancelProjectLifecycleRequest
      tags: [project-lifecycle-requests]
      summary: |
        Cancel the caller's own pending create request. The scaffolded
        project directory is removed and the request row is deleted.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Cancelled

  /projects/clone:
    post:
      operationId: cloneProjectFromRepo
      tags: [project]
      summary: |
        Clone an existing Git repository into a new project. Mirrors
        the Configure Project Git Repo shape (provider, repoUrl,
        branch, inline PAT or `repoPatId`). On success, persists a
        matching `project_git_configs` row so subsequent pull/push
        works without further setup. Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloneProjectFromRepoRequest"
      responses:
        "201":
          description: Cloned and registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Clone failed (validation / auth / repo / branch)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloneProjectFromRepoError"
        "409":
          description: A project with that name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloneProjectFromRepoError"

  /projects/load:
    post:
      operationId: loadProject
      tags: [project]
      summary: Load an existing solution from the workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoadProjectRequest"
      responses:
        "200":
          description: Loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/available:
    get:
      operationId: listAvailableProjects
      tags: [project]
      summary: List existing .sln files in the workspace
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailableProject"

  /projects/disable:
    post:
      operationId: setProjectDisabled
      tags: [project]
      summary: Mark a project as disabled (hidden from Open Existing) or re-enable it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetProjectDisabledRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailableProject"

  /projects/delete:
    post:
      operationId: deleteProject
      tags: [project]
      summary: Request (or perform) deletion of a project directory
      description: |
        Two-path delete. When the caller is the sole `admin` in their
        active org (or a Memento Admin in an org with zero org Admins),
        the project is deleted immediately — but only when the body
        carries `acknowledgeIrreversible: true`. Otherwise the call
        creates a pending lifecycle request for another Admin (or
        Memento Admin) to approve.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteProjectRequest"
      responses:
        "200":
          description: Pending request created or project deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [deleted, pending]
                  requestId:
                    type: ["string", "null"]
                required: [status]

  /projects/{projectName}/delete-preflight:
    get:
      operationId: getDeleteProjectPreflight
      tags: [project]
      summary: Tell the UI whether deleting a project will require admin approval
      parameters:
        - in: path
          name: projectName
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Preflight result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteProjectPreflightResponse"

  /projects/clear-files:
    post:
      operationId: clearProjectFiles
      tags: [project]
      summary: Request (or perform) clearing every recording/codegen output from a project
      description: |
        Two-path clear. When the caller is the sole `admin` in their
        active org (or a Memento Admin in an org with zero org Admins),
        the project files are cleared immediately — but only when the
        body carries `acknowledgeIrreversible: true`. Otherwise the
        call creates a pending lifecycle request for another Admin (or
        Memento Admin) to approve. The scaffolded project skeleton is
        preserved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClearProjectFilesRequest"
      responses:
        "200":
          description: Pending request created or project files cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [cleared, pending]
                  requestId:
                    type: ["string", "null"]
                required: [status]

  /projects/{projectName}/clear-files-preflight:
    get:
      operationId: getClearProjectFilesPreflight
      tags: [project]
      summary: Tell the UI whether clearing a project's files will require admin approval
      parameters:
        - in: path
          name: projectName
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Preflight result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClearProjectFilesPreflightResponse"

  /projects/tree:
    get:
      operationId: getProjectTree
      tags: [project]
      summary: Get the file tree for the current project
      responses:
        "200":
          description: Tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeNode"

  /projects/zip:
    get:
      operationId: downloadProjectZip
      tags: [project]
      summary: Download a project as a zip
      parameters:
        - in: query
          name: slnPath
          required: false
          description: |
            Optional path to the project marker file (.sln, pyproject.toml,
            package.json, or pom.xml). When provided, that project is zipped
            instead of the currently loaded one.
          schema: { type: string }
      responses:
        "200":
          description: Zip archive
          content:
            application/zip:
              schema:
                type: string
                format: binary

  /projects/pipeline-file:
    post:
      operationId: generatePipelineFile
      tags: [project]
      summary: Generate a CI/CD pipeline file in the loaded project root
      description: |
        Writes a platform-appropriate pipeline file (YAML for GitHub
        Actions / GitLab CI / Azure Pipelines / CircleCI, or a Groovy
        `Jenkinsfile` for Jenkins) into the currently loaded project
        root, using a per-language template. When the target file
        already exists and `overwrite` is not true, returns 409 with
        the conflicting path so the caller can prompt for confirmation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratePipelineFileRequest"
      responses:
        "201":
          description: Pipeline file written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratePipelineFileResponse"
        "404":
          description: No project loaded
        "409":
          description: Target pipeline file already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratePipelineFileConflict"

  /projects/{projectName}/git-config:
    parameters:
      - in: path
        name: projectName
        required: true
        schema: { type: string }
    get:
      operationId: getProjectGitConfig
      tags: [project]
      summary: Read the per-project Azure Repos configuration (admin only)
      responses:
        "200":
          description: Current configuration (empty when never set)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectGitConfig"
    put:
      operationId: putProjectGitConfig
      tags: [project]
      summary: Create or update the per-project Azure Repos configuration (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectGitConfigInput"
      responses:
        "200":
          description: Stored configuration (PAT redacted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectGitConfig"

  /projects/{projectName}/git-config/pull:
    parameters:
      - in: path
        name: projectName
        required: true
        schema: { type: string }
    post:
      operationId: pullProjectGitConfig
      tags: [project]
      summary: |
        Overwrite the project directory with a fresh shallow clone of
        the configured branch. Backs up the previous contents to
        `<dir>.bak-<timestamp>` for one-step manual rollback. Admin only.
      responses:
        "200":
          description: Pull completed (success or domain failure)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectGitPullResult"
        "400":
          description: Pull failed (auth / repo / branch / validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectGitPullResult"

  /projects/{projectName}/git-config/push:
    parameters:
      - in: path
        name: projectName
        required: true
        schema: { type: string }
    post:
      operationId: pushProjectGitConfig
      tags: [project]
      summary: |
        Commit the current project directory and push it back to the
        configured Git provider on the configured branch using the
        stored PAT. Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectGitPushBody"
      responses:
        "200":
          description: Push completed (success or domain failure)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectGitPushResult"
        "400":
          description: Push failed (auth / repo / branch / validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectGitPushResult"

  /projects/{projectName}/branches:
    parameters:
      - in: path
        name: projectName
        required: true
        schema: { type: string }
    get:
      operationId: listProjectBranches
      tags: [project]
      summary: |
        List local branches in the project's working copy and report the
        currently checked-out branch. Admin only.
      responses:
        "200":
          description: Branch list (empty when the working copy isn't a git repo yet)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectBranchList"
    post:
      operationId: createProjectBranch
      tags: [project]
      summary: |
        Create a new local branch off the current HEAD. Optionally
        checks it out. Does not push to the remote. Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBranchInput"
      responses:
        "200":
          description: |
            Always returned on a well-formed request. Domain failures
            (invalid name, already exists, dirty working copy, no git
            working copy) surface as `{ok: false, errorCode, message}`
            in the same payload so the React client receives them
            through the normal mutation result rather than as a
            thrown error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectBranchOpResult"

  /projects/{projectName}/branches/checkout:
    parameters:
      - in: path
        name: projectName
        required: true
        schema: { type: string }
    post:
      operationId: checkoutProjectBranch
      tags: [project]
      summary: |
        Switch the working copy to an existing local branch. Admin only.
        Refuses when the working copy has uncommitted changes unless
        `force: true` is passed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutBranchInput"
      responses:
        "200":
          description: |
            Always returned on a well-formed request. Domain failures
            (dirty working copy, unknown branch, no git working copy)
            surface as `{ok: false, errorCode, message}` in the same
            payload so the React client receives them through the
            normal mutation result rather than as a thrown error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectBranchOpResult"

  /projects/{projectName}/my-fork:
    parameters:
      - in: path
        name: projectName
        required: true
        schema: { type: string }
    get:
      operationId: getMyProjectFork
      tags: [project]
      summary: |
        Read the calling user's personal fork config for this project.
        Returns an empty/null payload when the user has not configured a
        fork. Any signed-in user can call this; users only ever see
        their own fork.
      responses:
        "200":
          description: Current personal fork (PAT redacted, or null when unset)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProjectFork"
    put:
      operationId: putMyProjectFork
      tags: [project]
      summary: |
        Create or update the calling user's personal fork config for
        this project. Any signed-in user can call this; users only
        ever write their own fork.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProjectForkInput"
      responses:
        "200":
          description: Stored personal fork (PAT redacted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProjectFork"
    delete:
      operationId: deleteMyProjectFork
      tags: [project]
      summary: |
        Clear the calling user's personal fork config for this project.
        After clearing, Push falls back to the shared upstream config.
      responses:
        "204":
          description: Cleared (no-op when none configured)

  /auth/sso/request-access:
    post:
      operationId: requestSsoAccess
      tags: [auth]
      summary: Submit an in-app "Request access" form from the SSO deny banner
      description: |
        Unauthenticated. Persists the request so it appears in the
        admin's pending-access queue without depending on a desktop
        mail client. The denying `gate` and the bound org's
        `externalKey` are passed through from the deny redirect.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SsoAccessRequestInput"
      responses:
        "204":
          description: Request recorded.
        "400":
          description: Malformed request body.

  /sso-access-requests:
    get:
      operationId: listSsoAccessRequests
      tags: [sso-access-requests]
      summary: List in-app "Request access" submissions (admin only)
      description: |
        Returns up to 100 most recent in-app access requests submitted
        from the SSO deny banner, newest first. By default only pending
        rows are returned; pass `includeResolved=true` to include rows
        an admin has already marked handled.
      parameters:
        - in: query
          name: includeResolved
          required: false
          schema: { type: boolean, default: false }
          description: |
            When true, the response includes rows that have been
            marked resolved (granted or dismissed) in addition to
            pending ones.
      responses:
        "200":
          description: List of access requests, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SsoAccessRequest"

  /sso-access-requests/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateSsoAccessRequest
      tags: [sso-access-requests]
      summary: Mark an in-app access request handled (admin only)
      description: |
        Flips the row to handled with the resolving admin and a server
        timestamp. Sending `resolution: "pending"` clears the resolved
        marker and returns the row to the pending queue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SsoAccessRequestUpdateInput"
      responses:
        "200":
          description: Updated row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SsoAccessRequest"
        "404":
          description: No row with that id.

  /sso-denials:
    get:
      operationId: listSsoDenials
      tags: [sso-denials]
      summary: List recent SSO sign-in denials (admin only)
      description: |
        Returns up to 50 most recent SSO sign-ins that were rejected by
        the identity provider claim gates (`mementoUser` user-gate and
        `mementoAccess` org-gate). Rows older than 30 days are pruned
        lazily on each call. Used by Admin → Source control → SSO
        denials so an admin can confirm a denied user attempted a
        sign-in and respond.

        By default, denials an admin has marked handled are hidden so
        the queue only shows actionable rows. Pass `includeHandled=true`
        to surface dismissed denials too (used by the "Show handled"
        toggle in the admin UI).
      parameters:
        - in: query
          name: includeHandled
          required: false
          schema: { type: boolean, default: false }
          description: |
            When true, include denials that an admin has marked handled.
            Defaults to false so the queue stays focused on open rows.
      responses:
        "200":
          description: List of recent denials, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SsoDenial"

  /sso-denials/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateSsoDenial
      tags: [sso-denials]
      summary: Mark an SSO denial as handled or reopen one (admin only)
      description: |
        Toggles the handled state of a denial row. When `handled: true`
        the row is stamped with the calling admin's id and the current
        timestamp so it disappears from the default queue (still visible
        under "Show handled"). When `handled: false` those fields are
        cleared and the row returns to the open queue. The action is
        captured in the audit log (`sso_denial_dismiss` /
        `sso_denial_unhandle`) so we have a record of who handled what.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SsoDenialUpdate"
      responses:
        "200":
          description: Updated denial row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SsoDenial"
        "404":
          description: No denial with that id exists.

  /repo-pats:
    get:
      operationId: listRepoPats
      tags: [repo-pats]
      summary: List reusable Git Personal Access Tokens (admin only)
      responses:
        "200":
          description: List of reusable PATs (plaintext PAT never returned)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RepoPat"
    post:
      operationId: createRepoPat
      tags: [repo-pats]
      summary: Create a new reusable Git PAT (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepoPatInput"
      responses:
        "201":
          description: Stored PAT (plaintext redacted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoPat"

  /repo-pats/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateRepoPat
      tags: [repo-pats]
      summary: Update a reusable Git PAT (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepoPatUpdateInput"
      responses:
        "200":
          description: Updated PAT (plaintext redacted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoPat"
    delete:
      operationId: deleteRepoPat
      tags: [repo-pats]
      summary: Delete a reusable Git PAT (admin only)
      responses:
        "204":
          description: Deleted
        "409":
          description: Cannot delete — PAT is bound to one or more projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteRepoPatConflict"

  /files:
    get:
      operationId: getFileContent
      tags: [files]
      summary: Read a file
      parameters:
        - in: query
          name: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: File contents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileContentResponse"
    post:
      operationId: createFile
      tags: [files]
      summary: Create a file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFileRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
    put:
      operationId: updateFile
      tags: [files]
      summary: Update a file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFileRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
    delete:
      operationId: deleteFile
      tags: [files]
      summary: Delete a file
      parameters:
        - in: query
          name: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"

  /files/rename:
    post:
      operationId: renameFile
      tags: [files]
      summary: Rename a file or folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameRequest"
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"

  /folders:
    post:
      operationId: createFolder
      tags: [files]
      summary: Create a folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFolderRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"

  /projects/api-base-urls:
    get:
      operationId: listApiBaseUrls
      tags: [project]
      summary: List ApiTest:Urls entries from the current API project's appsettings.json
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiBaseUrlInfo"

  /tests:
    get:
      operationId: listTestClasses
      tags: [project]
      summary: List test class files under Tests/
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TestClassInfo"

  /projects/{projectId}/tests:
    parameters:
      - in: path
        name: projectId
        required: true
        schema: { type: string }
        description: |
          The project identifier — the URL-encoded `slnPath` of a
          project the caller has access to. Memento projects have no
          separate numeric id; `slnPath` is the stable, unique
          identifier used everywhere else (`/projects/load`,
          `/projects/available`).
    get:
      operationId: discoverProjectTests
      tags: [tests]
      summary: |
        Discover every test method in the given project across all four
        supported languages (C#, Python, Node.js, Java) and return them
        as a folder/file/method tree. Each leaf method is tagged with a
        `kind` of `e2e`, `unit`, or `api` (folder convention is the
        default classifier; an explicit tag/attribute on the method or
        its enclosing class overrides folder placement). Every folder
        node carries rolled-up `totals` so the UI can render counts at
        any depth.
      responses:
        "200":
          description: Discovery tree for the project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestDiscoveryResponse"
        "400":
          description: Malformed `projectId` (e.g. not a valid URL-encoded slnPath).
        "401":
          description: Not authenticated.
        "404":
          description: Project not found or not accessible to the caller.

  /projects/{projectId}/runs/by-selection/{runId}:
    parameters:
      - in: path
        name: projectId
        required: true
        schema: { type: string }
        description: URL-encoded `slnPath` of the project that owns the run.
      - in: path
        name: runId
        required: true
        schema: { type: string }
        description: |
          The selection-run id returned by `POST .../runs/by-selection`.
          A run id is only readable through the project URL it was
          dispatched against — mismatched pairs return 404 to avoid
          leaking the existence of unrelated runs.
    get:
      operationId: getProjectSelectionRun
      tags: [tests]
      summary: |
        Return the latest snapshot of a selection-based run. The UI
        polls this until `finishedAt` is non-null and renders
        `status` / `exitCode` / `stdout` / `stderr` so SDETs see real
        compile errors and assertion traces inline instead of having
        to dig through server logs.
      responses:
        "200":
          description: Selection run snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelectionRunDetail"
        "401":
          description: Not authenticated.
        "404":
          description: Run not found, or the runId does not belong to this project.

  /projects/{projectId}/runs/by-selection:
    parameters:
      - in: path
        name: projectId
        required: true
        schema: { type: string }
        description: URL-encoded `slnPath` of the project to run against.
    post:
      operationId: runProjectTestsBySelection
      tags: [tests]
      summary: |
        Run a caller-supplied set of test IDs returned by the discovery
        endpoint. The IDs may span multiple languages within one project;
        the server groups them by language and dispatches each group to
        the correct CLI runner (`dotnet test --filter`, `pytest`,
        `npx playwright test --grep`, `gradle test --tests`). Each
        per-language dispatch returns the same `InternalTestRun` shape
        used by the existing run-project endpoint, so the UI can wire
        each entry to the existing run-detail flow without a parallel
        contract.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunBySelectionRequest"
      responses:
        "200":
          description: Selection-based run dispatched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunBySelectionResponse"
        "400":
          description: Empty or malformed selection.
        "401":
          description: Not authenticated.
        "404":
          description: Project not found or not accessible to the caller.

  /codegen/test-class:
    post:
      operationId: generateTestClass
      tags: [codegen]
      summary: Generate a new NUnit test class
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateTestClassRequest"
      responses:
        "201":
          description: Generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"

  /codegen/test-method:
    post:
      operationId: generateTestMethod
      tags: [codegen]
      summary: Insert a new test method into an existing class
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateTestMethodRequest"
      responses:
        "200":
          description: Inserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"

  /architectures:
    get:
      operationId: listArchitectures
      tags: [architecture]
      summary: List built-in and custom architectures
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Architecture"
    post:
      operationId: upsertArchitecture
      tags: [architecture]
      summary: Create or update a custom architecture
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Architecture"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Architecture"

  /architectures/{id}:
    get:
      operationId: getArchitecture
      tags: [architecture]
      summary: Get a single architecture by id
      parameters:
        - in: path
          name: id
          required: true
