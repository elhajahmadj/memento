# fly.toml app configuration file generated for memento-playwright on 2026-05-06T03:43:09Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'memento-playwright'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[env]
  APP_ENVIRONMENT = 'production'
  NODE_ENV = 'production'
  PORT = '8080'
  SPA_DIST_DIR = '/app/artifacts/test-builder/dist/public'
  WORKSPACE_DIR = '/data'

[[mounts]]
  source = 'recorder_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'get'
    path = '/api/healthz'
    protocol = 'http'

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
