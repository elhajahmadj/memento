  clsx: ^2.1.1
  drizzle-orm: 0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: 4.21.0
  vite: ^7.3.5
  zod: 3.25.76

minimumReleaseAge: 1440

minimumReleaseAgeExclude: []

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver

overrides:
  # ---- Security advisories (see docs/plans/SECURITY-MEMORY-AUDIT-PLAN.md) ----
  # Minimum-version floors for transitive packages with known advisories.
  # Caret ranges, deliberately NOT open ">=" floors: the patched version
  # must stay inside the major its dependents were built against. An open
  # floor resolved nanoid 3 -> 6 and js-yaml 4 -> 5, which is a breaking
  # change smuggled in as a security fix. Drop an entry once every
  # dependent resolves above the floor on its own.
  brace-expansion: "^2.1.4"   # GHSA-3jxr-9vmj-r5cp, -mh99-v99m-4gvg, -rgw5-rvv9-x895
  fast-uri: "^3.1.5"          # GHSA-v2hh-gcrm-f6hx, -7p8r-x3mc-p8w7
  form-data: "^4.0.6"         # GHSA-hmw2-7cc7-3qxx
  js-yaml: "^4.3.1"           # GHSA-52cp-r559-cp3m, -5p4m-2wfm-xmqj
  linkify-it: "^5.0.2"        # GHSA-22p9-wv53-3rq4, -v245-v573-v5vm
  lodash: "^4.18.0"           # GHSA-r5fr-rjxr-66jc (production: archiver -> project zip)
  nanoid: "^3.3.18"           # GHSA-28wg-ghj8-5hjv, -2v37-7h3g-55p8
  picomatch: "^4.0.4"         # GHSA-c2c7-rcm5-vvqj
  postcss: "^8.5.18"          # GHSA-6g55-p6wh-862q, -r28c-9q8g-f849
  body-parser: "^2.3.0"       # GHSA-v422-hmwv-36x6 (production, via express) - an invalid
                              # limit silently disables size enforcement, which would quietly
                              # undo the explicit body limits set in app.ts
  "@babel/core": "^7.29.6"    # GHSA (dev: @vitejs/plugin-react)
  markdown-it: "^14.2.0"      # dev: orval > typedoc
  vite: "^7.3.5"              # GHSA-fx2h-pf6j-xcff (dev: vitest pins its own vite)
  yaml: "^2.8.3"              # dev: vitest > vite
